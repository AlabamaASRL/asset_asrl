name: manylinux-wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_linux_compat:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        compiler: ["clang-13"]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Ubuntu dependencies
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt
          python -m pip install patchelf auditwheel

      - name: Configure CMake
        run: |
          cmake -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPIP_INSTALL=True \
            -DBUILD_ASSET_WHEEL=True \
            -DPython_EXECUTABLE="$(which python)" \
            -DPython3_EXECUTABLE="$(which python)" \
            -DPYTHON_EXECUTABLE="$(which python)"

      - name: Build asset module
        run: |
          cmake --build build \
            --target asset \
            --config Release \
            -- -j2

      - name: Build wheel
        run: |
          cmake --build build \
            --target pypiwheel \
            --config Release \
            -- -j2

      - name: Locate wheels
        run: |
          find build -type f -name "*.whl" -print | tee wheel_list.txt
          test -s wheel_list.txt

      - name: Audit wheel
        run: |
          while read -r whl; do
            auditwheel show "$whl"
          done < wheel_list.txt

      - name: Repair wheel
        run: |
          mkdir -p wheelhouse
          # No --plat: auditwheel picks the best tag this build actually
          # qualifies for. Ubuntu 22.04 uses glibc 2.35, so manylinux_2_31
          # cannot be satisfied.
          while read -r whl; do
            auditwheel repair "$whl" -w wheelhouse
          done < wheel_list.txt
          ls -l wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist_${{ matrix.python-version }}_${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 5

  collect:
    needs: [build_linux_compat]
    runs-on: ubuntu-22.04

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: dist_*
          path: wheels
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R wheels

      - name: Upload combined wheels
        uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: wheels/
          if-no-files-found: error
          retention-days: 7
