name: Build C++ development target

on:
  push:
    branches:
      - kurelowech_pines

  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit SHA to diff against for selective C++ builds
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: C++ build - Ubuntu 22.04
    runs-on: ubuntu-22.04

    env:
      BUILD_TYPE: RelWithDebInfo
      PYTHON_VERSION: "3.9"
      PYTHON_TARGET: asset

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ============================================================
      # UBUNTU DEPENDENCIES
      # ============================================================

      - name: Install Ubuntu dependencies
        env:
          COMPILER: clang-13
        shell: bash
        run: |
          set -euo pipefail

          bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-22.04-clang-13
          max-size: 2G

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          ccache --version
          ccache --zero-stats

          echo "CCACHE_DIR=${CCACHE_DIR:-}"

      # ============================================================
      # PYTHON BUILD REQUIREMENTS
      # ============================================================

      - name: Install Python build requirements
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      # ============================================================
      # PREPARE BUILD DIRECTORIES
      #
      # IMPORTANT:
      # Do NOT delete build/.
      #
      # Keeping build/ allows CMake/Ninja to perform an incremental
      # build and lets ccache reuse previously compiled objects.
      # ============================================================

      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build
          mkdir -p dist

          echo "Build directory:"
          ls -la build

      # ============================================================
      # DETECT CHANGED C/C++ FILES
      #
      # This determines whether a C++ build is needed.
      #
      # We intentionally include headers because changing a header
      # can require dependent .cpp files to be rebuilt.
      #
      # CMake/Ninja is responsible for determining exactly which
      # translation units need recompilation.
      # ============================================================

      - name: Detect changed C/C++ files
        id: cpp_changes
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DETECTING CHANGED C/C++ FILES"
          echo "============================================================"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                -n "${{ inputs.base_sha }}" ]]; then

            echo "Using manually supplied base SHA:"
            echo "${{ inputs.base_sha }}"

            if ! git rev-parse --verify \
              "${{ inputs.base_sha }}^{commit}" \
              >/dev/null 2>&1; then

              echo "::error::Invalid base_sha:"
              echo "${{ inputs.base_sha }}"

              exit 1
            fi

            base_ref="${{ inputs.base_sha }}"

          else

            default_branch="${{ github.event.repository.default_branch }}"

            echo "Default branch:"
            echo "$default_branch"

            git fetch \
              --no-tags \
              origin \
              "$default_branch:refs/remotes/origin/$default_branch"

            base_ref="$(
              git merge-base \
                HEAD \
                "origin/$default_branch"
            )"

          fi

          echo
          echo "Base commit:"
          echo "$base_ref"

          echo
          echo "Current commit:"
          git rev-parse HEAD

          mapfile -t changed_files < <(
            git diff \
              --name-only \
              --diff-filter=ACMR \
              "$base_ref" \
              HEAD \
              -- \
              '*.c' \
              '*.cc' \
              '*.cpp' \
              '*.cxx' \
              '*.h' \
              '*.hh' \
              '*.hpp' \
              '*.hxx' \
            | sed '/^[[:space:]]*$/d'
          )

          echo
          echo "Number of changed C/C++ files:"
          echo "${#changed_files[@]}"

          : > build/changed_cxx_files.txt

          if [[ "${#changed_files[@]}" -eq 0 ]]; then

            echo "cpp_changes_detected=false" >> "$GITHUB_OUTPUT"

            echo
            echo "No C/C++ changes detected."
            echo "The C++ build will be skipped."

          else

            echo
            echo "Changed C/C++ files:"
            printf '  %s\n' "${changed_files[@]}"

            printf '%s\n' "${changed_files[@]}" \
              > build/changed_cxx_files.txt

            echo "cpp_changes_detected=true" >> "$GITHUB_OUTPUT"

          fi

      # ============================================================
      # LOG CHANGED FILES
      # ============================================================

      - name: Log changed files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CHANGED C/C++ FILES"
          echo "============================================================"

          if [[ -s build/changed_cxx_files.txt ]]; then

            nl -ba build/changed_cxx_files.txt

            echo
            echo "File count:"
            wc -l build/changed_cxx_files.txt

          else

            echo "No C/C++ file changes detected."

          fi

      # ============================================================
      # CONFIGURE CMAKE
      #
      # Only configure when C++ work is required.
      #
      # Ninja provides fast incremental dependency checking.
      # ============================================================

      - name: Configure CMake
        if: steps.cpp_changes.outputs.cpp_changes_detected == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CONFIGURING CMAKE"
          echo "============================================================"

          python_executable="$(
            python -c 'import sys; print(sys.executable)'
          )"

          echo "Python executable:"
          echo "$python_executable"

          echo
          echo "CMake configuration:"

          cmake -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPIP_INSTALL=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="$python_executable"

      # ============================================================
      # BUILD PRECOMPILED HEADERS
      #
      # Ninja will skip this when the PCH is already current.
      # ============================================================

      - name: Build precompiled headers
        if: steps.cpp_changes.outputs.cpp_changes_detected == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING PRECOMPILED HEADERS"
          echo "============================================================"

          jobs=$(( $(nproc) / 2 ))

          if [[ "$jobs" -lt 1 ]]; then
            jobs=1
          fi

          echo "Available CPUs:"
          nproc

          echo "Using parallel jobs:"
          echo "$jobs"

          cmake --build build \
            --target pch \
            --config "${BUILD_TYPE}" \
            --parallel "$jobs"

      # ============================================================
      # BUILD PYTHON EXTENSION
      #
      # IMPORTANT:
      #
      # We build the "asset" target.
      #
      # Ninja/CMake determines which source files are stale.
      # We do NOT manually compile only the files listed in
      # changed_cxx_files.txt.
      #
      # This is important for header changes because a changed
      # header may require several .cpp files to be rebuilt.
      # ============================================================

      - name: Build Python extension
        if: steps.cpp_changes.outputs.cpp_changes_detected == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING PYTHON EXTENSION"
          echo "============================================================"

          echo "Target:"
          echo "${PYTHON_TARGET}"

          jobs=$(( $(nproc) / 2 ))

          if [[ "$jobs" -lt 1 ]]; then
            jobs=1
          fi

          echo
          echo "Available CPUs:"
          nproc

          echo
          echo "Using parallel jobs:"
          echo "$jobs"

          echo
          echo "Build command:"

          cmake --build build \
            --target "${PYTHON_TARGET}" \
            --config "${BUILD_TYPE}" \
            --parallel "$jobs" \
            --verbose

      # ============================================================
      # CCACHE STATISTICS
      # ============================================================

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CCACHE STATISTICS"
          echo "============================================================"

          ccache --show-stats || true

      # ============================================================
      # VERIFY BUILD OUTPUT
      # ============================================================

      - name: Verify build output
        if: steps.cpp_changes.outputs.cpp_changes_detected == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING BUILD OUTPUT"
          echo "============================================================"

          echo "Build directory:"
          du -sh build || true

          echo
          echo "Python extension files:"

          find build \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.pyd" \
            \) \
            -print \
            | sort

      # ============================================================
      # NO C++ CHANGES
      # ============================================================

      - name: Skip C++ build
        if: steps.cpp_changes.outputs.cpp_changes_detected != 'true'
        shell: bash
        run: |
          echo "============================================================"
          echo "NO C/C++ CHANGES"
          echo "============================================================"
          echo
          echo "No C/C++ source or header files changed."
          echo "Skipping CMake/C++ compilation."

      # ============================================================
      # COMMIT GENERATED BINARIES
      #
      # This preserves the behavior of committing generated build
      # artifacts back to the branch.
      # ============================================================

      - name: Commit generated binaries
        if: steps.cpp_changes.outputs.cpp_changes_detected == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMMITTING GENERATED BINARIES"
          echo "============================================================"

          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit \
            -m "Build C++ binaries"

          git push
