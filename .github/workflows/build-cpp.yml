name: Build C++ development target

on:
  push:
    branches:
      - kurelowech_pines

  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit SHA to diff against for selective C++ builds
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: C++ build - Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Ubuntu dependencies
        env:
          COMPILER: clang-13
        run: bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-22.04-clang-13
          max-size: 2G

      - name: Install Python build requirements
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      # CMake build directories contain machine-specific cache files,
      # generated PCH files, object files, and dependency metadata.
      # They must not be reused between workflow runs.
      - name: Clean CMake build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPIP_INSTALL=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      - name: Detect changed C/C++ files
        id: cpp_changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                -n "${{ inputs.base_sha }}" ]]; then

            if ! git rev-parse --verify "${{ inputs.base_sha }}^{commit}" >/dev/null 2>&1; then
              echo "::error::Invalid base_sha: ${{ inputs.base_sha }}"
              exit 1
            fi

            base_ref="${{ inputs.base_sha }}"
          else
            default_branch="${{ github.event.repository.default_branch }}"

            git fetch --no-tags origin \
              "$default_branch:refs/remotes/origin/$default_branch"

            if ! git rev-parse --verify "origin/$default_branch" >/dev/null 2>&1; then
              echo "::error::Unable to find origin/$default_branch"
              exit 1
            fi

            base_ref="$(git merge-base HEAD "origin/$default_branch")"
          fi

          echo "Current commit: ${{ github.sha }}"
          echo "Base commit:    $base_ref"

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR \
              "$base_ref" "${{ github.sha }}" \
              -- \
              '*.c' '*.cc' '*.cpp' '*.cxx' \
              '*.h' '*.hh' '*.hpp' '*.hxx' \
            | sed '/^[[:space:]]*$/d'
          )

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No C/C++ source or header changes detected."
            exit 0
          fi

          echo "Changed C/C++ files:"
          printf '%s\n' "${changed_files[@]}"

          printf '%s\n' "${changed_files[@]}" \
            > build/changed_cxx_files.txt

          # Preserve the old filename for compatibility with existing tooling.
          cp build/changed_cxx_files.txt build/changed_cpp_files.txt

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Compile changed C/C++ source files and validate headers
        id: compile_changed
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import shlex
          import subprocess
          import tempfile
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          build = (repo / "build").resolve()

          source_suffixes = {
              ".c",
              ".cc",
              ".cpp",
              ".cxx",
          }

          header_suffixes = {
              ".h",
              ".hh",
              ".hpp",
              ".hxx",
          }

          changed_files = []

          for line in (build / "changed_cxx_files.txt").read_text().splitlines():
              line = line.strip()

              if not line:
                  continue

              path = (repo / line).resolve()

              if path.exists():
                  changed_files.append(path)

          compile_db_path = build / "compile_commands.json"

          if not compile_db_path.exists():
              print(
                  "::error::Missing compile database: "
                  f"{compile_db_path}"
              )
              raise SystemExit(1)

          compile_db = json.loads(compile_db_path.read_text())

          def resolve_entry_path(entry):
              file_path = Path(entry["file"])

              if not file_path.is_absolute():
                  file_path = (
                      Path(entry["directory"]) / file_path
                  ).resolve()
              else:
                  file_path = file_path.resolve()

              return file_path

          entry_by_file = {}

          for entry in compile_db:
              entry_by_file[
                  resolve_entry_path(entry)
              ] = entry

          source_files = []
          header_files = []

          for path in changed_files:
              suffix = path.suffix.lower()

              if suffix in source_suffixes:
                  source_files.append(path)
              elif suffix in header_suffixes:
                  header_files.append(path)

          def command_from_entry(entry):
              arguments = entry.get("arguments")

              if isinstance(arguments, list):
                  return list(arguments)

              command = entry.get("command")

              if command:
                  return shlex.split(command)

              print(
                  "::error::Compile database entry is missing both "
                  "'arguments' and 'command' for "
                  f"{entry.get('file', '<unknown>')}"
              )
              raise SystemExit(1)

          def resolve_path(path_string, base_dir):
              path = Path(path_string)

              if not path.is_absolute():
                  return (base_dir / path).resolve()

              return path.resolve()

          def infer_target_name(path):
              parts = path.parts

              for index, part in enumerate(parts):
                  if part != "CMakeFiles":
                      continue

                  if index + 1 >= len(parts):
                      continue

                  target_directory = parts[index + 1]

                  if target_directory.endswith(".dir"):
                      return target_directory[:-4]

              return None

          prepared_targets = set()

          def find_pch_paths(command, workdir):
              """
              Find PCH paths in both direct and Clang-wrapped forms.

              Supported forms include:

                  -include-pch <path>

                  -Xclang -include-pch -Xclang <path>

                  -include-pch=<path>
              """
              pch_paths = []
              index = 0

              while index < len(command):
                  argument = command[index]

                  # Clang commonly emits:
                  # -Xclang -include-pch -Xclang <pch-file>
                  if (
                      argument == "-Xclang"
                      and index + 1 < len(command)
                      and command[index + 1] == "-include-pch"
                  ):
                      index += 2

                      while (
                          index < len(command)
                          and command[index] == "-Xclang"
                      ):
                          index += 1

                      if index >= len(command):
                          break

                      pch_paths.append(
                          resolve_path(command[index], workdir)
                      )
                      index += 1
                      continue

                  # Direct form:
                  # -include-pch <pch-file>
                  if argument == "-include-pch":
                      index += 1

                      while (
                          index < len(command)
                          and command[index] == "-Xclang"
                      ):
                          index += 1

                      if index < len(command):
                          pch_paths.append(
                              resolve_path(command[index], workdir)
                          )
                          index += 1

                      continue

                  if argument.startswith("-include-pch="):
                      pch_paths.append(
                          resolve_path(
                              argument.split("=", 1)[1],
                              workdir,
                          )
                      )
                      index += 1
                      continue

                  # Some command generators concatenate the option and path.
                  if (
                      argument.startswith("-include-pch")
                      and argument != "-include-pch"
                  ):
                      pch_paths.append(
                          resolve_path(
                              argument[len("-include-pch"):],
                              workdir,
                          )
                      )
                      index += 1
                      continue

                  if argument.endswith(".pch"):
                      pch_paths.append(
                          resolve_path(argument, workdir)
                      )

                  index += 1

              return pch_paths

          def ensure_pch_prerequisites(command, workdir):
              for pch_path in find_pch_paths(command, workdir):
                  if pch_path.exists():
                      continue

                  target_name = infer_target_name(pch_path)

                  if target_name is None:
                      print(
                          "::error::Unable to infer CMake target for "
                          f"missing precompiled header: {pch_path}"
                      )
                      raise SystemExit(1)

                  if target_name in prepared_targets:
                      continue

                  print(
                      "Building prerequisite target:",
                      target_name,
                  )

                  result = subprocess.run(
                      [
                          "cmake",
                          "--build",
                          str(build),
                          "--target",
                          target_name,
                          "--parallel",
                          "1",
                      ],
                      cwd=repo,
                  )

                  if result.returncode != 0:
                      raise SystemExit(result.returncode)

                  prepared_targets.add(target_name)

          def remove_output_flags(command):
              result = []
              index = 0

              while index < len(command):
                  argument = command[index]

                  if argument in ("-o", "-MF", "-MT"):
                      index += 2
                      continue

                  if argument.startswith("-MF") or argument.startswith("-MT"):
                      index += 1
                      continue

                  result.append(argument)
                  index += 1

              return result

          def replace_source(command, original, replacement, workdir):
              original = original.resolve()

              for index, argument in enumerate(command):
                  if argument.startswith("-"):
                      continue

                  candidate = Path(argument)

                  if not candidate.is_absolute():
                      candidate = (
                          workdir / candidate
                      ).resolve()
                  else:
                      candidate = candidate.resolve()

                  if candidate == original:
                      command[index] = str(replacement)
                      return

              command.append(str(replacement))

          def choose_header_command(header_path):
              candidates = []

              for entry in compile_db:
                  source_path = resolve_entry_path(entry)

                  if source_path.suffix.lower() not in source_suffixes:
                      continue

                  same_directory = (
                      header_path.parent == source_path.parent
                  )

                  try:
                      relative_path = header_path.relative_to(
                          source_path.parent
                      )
                      distance = len(relative_path.parts)
                  except ValueError:
                      distance = 9999

                  score = (
                      0 if same_directory else 1,
                      distance,
                      str(source_path),
                  )

                  candidates.append((score, entry))

              if not candidates:
                  return None

              candidates.sort(key=lambda item: item[0])
              return candidates[0][1]

          missing_sources = []

          for source in source_files:
              if source not in entry_by_file:
                  missing_sources.append(
                      str(source.relative_to(repo))
                  )

          if missing_sources:
              print(
                  "::error::No compile database mapping for changed "
                  "source files: "
                  + ", ".join(missing_sources)
              )
              raise SystemExit(1)

          # Compile changed source files using their exact compile database
          # commands. This generates the normal object/dependency outputs.
          for source in source_files:
              entry = entry_by_file[source]
              command = command_from_entry(entry)
              workdir = Path(entry["directory"]).resolve()
              source_path = resolve_entry_path(entry)

              ensure_pch_prerequisites(command, workdir)

              replace_source(
                  command,
                  source_path,
                  source_path,
                  workdir,
              )

              print(
                  "Compiling source:",
                  source.relative_to(repo),
              )

              result = subprocess.run(
                  command,
                  cwd=workdir,
              )

              if result.returncode != 0:
                  raise SystemExit(result.returncode)

          # Validate changed headers by including each one in a temporary
          # translation unit and using a nearby source file's compile flags.
          for header in header_files:
              entry = choose_header_command(header)

              if entry is None:
                  print(
                      "::error::No suitable compile command found for "
                      f"changed header: {header.relative_to(repo)}"
                  )
                  raise SystemExit(1)

              command = command_from_entry(entry)
              workdir = Path(entry["directory"]).resolve()
              source_path = resolve_entry_path(entry)

              ensure_pch_prerequisites(command, workdir)

              with tempfile.NamedTemporaryFile(
                  mode="w",
                  suffix=".cpp",
                  dir=str(header.parent),
                  delete=False,
                  encoding="utf-8",
              ) as temporary_file:
                  temporary_file.write(
                      f'#include "{header.name}"\n'
                  )
                  wrapper = Path(
                      temporary_file.name
                  ).resolve()

              try:
                  header_command = remove_output_flags(command)

                  replace_source(
                      header_command,
                      source_path,
                      wrapper,
                      workdir,
                  )

                  if "-fsyntax-only" not in header_command:
                      header_command.append("-fsyntax-only")

                  print(
                      "Checking header:",
                      header.relative_to(repo),
                  )

                  result = subprocess.run(
                      header_command,
                      cwd=workdir,
                  )

                  if result.returncode != 0:
                      raise SystemExit(result.returncode)
              finally:
                  try:
                      wrapper.unlink()
                  except FileNotFoundError:
                      pass

          print(
              f"Compiled {len(source_files)} changed source file(s) "
              f"and validated {len(header_files)} changed header file(s)."
          )
          PY

      # Build all configured targets so final libraries and extension modules
      # are available for committing.
      - name: Build development binaries
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build \
            --config RelWithDebInfo \
            --parallel "$(nproc)"

      # Do not commit CMake's build directory. It contains generated cache,
      # PCH, object, and dependency files that are not portable.
      - name: Prepare committed binaries
        if: steps.cpp_changes.outputs.has_changes == 'true'
        id: binaries
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          find build \
            -type f \
            \( \
              -name '*.so' \
              -o -name '*.so.*' \
              -o -name '*.a' \
              -o -name '*.dylib' \
              -o -name '*.dll' \
              -o -name '*.exe' \
            \) \
            -not -path '*/CMakeFiles/*' \
            -exec cp -f {} dist/ \;

          # Include extensionless native executables, but exclude CMake
          # metadata and object/dependency files.
          while IFS= read -r -d '' file; do
            if file "$file" | grep -Eq \
              'ELF .* (executable|shared object)|PE32 .* executable'; then
              cp -f "$file" dist/
            fi
          done < <(
            find build \
              -type f \
              -perm /111 \
              -not -path '*/CMakeFiles/*' \
              -print0
          )

          find dist -type f -print | sort

          if ! find dist -type f -print -quit | grep -q .; then
            echo "::error::No compiled binaries were found under build/."
            exit 1
          fi

          echo "has_binaries=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated C++ binaries
        if: steps.binaries.outputs.has_binaries == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist/

          if git diff --cached --quiet; then
            echo "No binary changes detected."
            exit 0
          fi

          git commit \
            -m "chore: update compiled binaries [skip ci]"

          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Verify selective build artifacts
        id: verify_artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f build/compile_commands.json ]]; then
            echo "::error::Missing expected artifact: build/compile_commands.json"
            exit 1
          fi

          if [[ "${{ steps.cpp_changes.outputs.has_changes }}" != "true" ]]; then
            echo "No C/C++ source or header changes detected."
            exit 0
          fi

          if [[ ! -f build/changed_cxx_files.txt ]]; then
            echo "::error::Missing changed file list: build/changed_cxx_files.txt"
            exit 1
          fi

          if [[ ! -d dist ]]; then
            echo "::error::Missing committed binary directory: dist"
            exit 1
          fi

      - name: Upload development artifacts
        if: always() && steps.verify_artifacts.outcome == 'success' && steps.cpp_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asset-asrl-cpp-build-ubuntu-22.04
          path: |
            build/compile_commands.json
            build/changed_cxx_files.txt
            build/changed_cpp_files.txt
            dist/
          if-no-files-found: error
          retention-days: 14
