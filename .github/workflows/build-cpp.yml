name: Build C++ development target

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            python: "3.12"
          - os: windows
            runner: windows-2022
            python: "3.12"

    env:
      WHEEL_DIR: build/asset_asrl/dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Initialize submodules
        shell: bash
        run: git submodule update --init --recursive

      # ---------------- Linux ----------------

      - name: Set up Python (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/install_ubuntu_dependencies.sh
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran
          python -m pip install --upgrade pip build wheel setuptools

      # ---------------- Windows ----------------

      - name: Set up Conda (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: build
          python-version: ${{ matrix.python }}
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          conda install --name build -y `
            -c conda-forge `
            cmake ninja mkl mkl-devel intel-openmp

          conda run --name build python -m pip install `
            --upgrade pip build wheel setuptools

          conda run --name build cmake --version

      # ---------------- Build ----------------

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m build --wheel --outdir "$WHEEL_DIR"

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          conda run --name build python -m build `
            --wheel `
            --outdir "$env:WHEEL_DIR"

      # ---------------- Verify ----------------

      - name: Verify wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          WHEEL=$(find "$WHEEL_DIR" -name "*.whl" | head -1)
          test -n "$WHEEL" || exit 1
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"
          echo "Built: $WHEEL"

      - name: Verify wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "$env:WHEEL_DIR\*.whl" |
            Select-Object -First 1

          if (-not $wheel) {
            Write-Error "No wheel found"
            exit 1
          }

          "WHEEL=$($wheel.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Built: $($wheel.FullName)"

      # ---------------- Test ----------------

      - name: Test wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --force-reinstall "$WHEEL"
          python -c "import asset_asrl; import asset_asrl.Astro; import asset_asrl.Extensions"
          echo "Linux wheel import test passed."

      - name: Test wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          conda run --name build python -m pip install `
            --force-reinstall "$env:WHEEL"

          conda run --name build python -c `
            "import asset_asrl; import asset_asrl.Astro; import asset_asrl.Extensions"

          Write-Host "Windows wheel import test passed."

      # ---------------- Artifacts ----------------

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: asset-wheel-${{ matrix.os }}
          path: ${{ env.WHEEL_DIR }}/*.whl
          if-no-files-found: error
          retention-days: 7

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asset-native-${{ matrix.os }}
          path: |
            build/src/asset*.so
            build/src/asset*.pyd
            build/asset*.so
            build/asset*.pyd
          if-no-files-found: warn
          retention-days: 7
