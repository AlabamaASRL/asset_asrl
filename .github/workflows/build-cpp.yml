name: Build C++ development target

on:
  push:
    branches:
      - kurelowech_pines

  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit SHA to diff against for selective C++ builds
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: C++ build - Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: Print runner information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RUNNER INFORMATION"
          echo "============================================================"

          echo "Date:"
          date

          echo
          echo "Hostname:"
          hostname

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc
          lscpu | head -40 || true

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "============================================================"

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Print repository information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "REPOSITORY INFORMATION"
          echo "============================================================"

          echo "Repository:"
          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit information:"
          git log -1 --decorate --stat

          echo
          echo "Git status:"
          git status --short

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Print Python information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "PYTHON INFORMATION"
          echo "============================================================"

          python --version
          python -c "import sys; print('Python executable:', sys.executable)"
          python -c "import sys; print('Python prefix:', sys.prefix)"
          python -c "import sys; print('Python version:', sys.version)"

          echo
          echo "pip:"
          python -m pip --version

      # ============================================================
      # UBUNTU DEPENDENCIES
      # ============================================================

      - name: Install Ubuntu dependencies
        env:
          COMPILER: clang-13
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING UBUNTU DEPENDENCIES"
          echo "============================================================"

          bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      # ============================================================
      # COMPILER INFORMATION
      # ============================================================

      - name: Print compiler information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMPILER INFORMATION"
          echo "============================================================"

          echo "clang:"
          clang --version || true

          echo
          echo "clang++:"
          clang++ --version || true

          echo
          echo "gcc:"
          gcc --version | head -1 || true

          echo
          echo "g++:"
          g++ --version | head -1 || true

          echo
          echo "cmake:"
          cmake --version

          echo
          echo "ninja:"
          ninja --version || true

          echo
          echo "make:"
          make --version | head -1

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-22.04-clang-13
          max-size: 2G

      - name: Print ccache information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CCACHE INFORMATION"
          echo "============================================================"

          ccache --version
          ccache --show-config || true
          ccache --show-stats || true

      # ============================================================
      # PYTHON BUILD REQUIREMENTS
      # ============================================================

      - name: Install Python build requirements
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING PYTHON REQUIREMENTS"
          echo "============================================================"

          python -m pip install --upgrade pip wheel setuptools

          python -m pip install -r requirements.txt

          echo
          echo "Installed packages:"
          python -m pip list

      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Clean CMake build directory
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CLEANING BUILD DIRECTORY"
          echo "============================================================"

          rm -rf build
          mkdir -p build

          echo
          echo "Build directory:"
          ls -la build

          echo
          echo "Memory:"
          free -h

      # ============================================================
      # CMAKE CONFIGURATION
      # ============================================================

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CONFIGURING CMAKE"
          echo "============================================================"

          python_executable="$(
            python -c 'import sys; print(sys.executable)'
          )"

          echo "Python executable:"
          echo "$python_executable"

          echo
          echo "CMake command:"

          echo \
            cmake -S . \
              -B build \
              -G "Unix Makefiles" \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DPIP_INSTALL=True \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DPython_EXECUTABLE="$python_executable"

          echo
          echo "Starting CMake configuration..."

          cmake -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPIP_INSTALL=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="$python_executable"

          echo
          echo "CMake configuration completed."

      # ============================================================
      # CMAKE CONFIGURATION LOGGING
      # ============================================================

      - name: Log CMake configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CMAKE CONFIGURATION"
          echo "============================================================"

          echo "CMake cache:"
          grep -E \
            '^(CMAKE_BUILD_TYPE|CMAKE_C_COMPILER|CMAKE_CXX_COMPILER|Python|PIP_INSTALL|CMAKE_GENERATOR)' \
            build/CMakeCache.txt \
            | sort \
            || true

          echo
          echo "CMake generator:"
          grep '^CMAKE_GENERATOR:' \
            build/CMakeCache.txt \
            || true

          echo
          echo "Build directory:"
          du -sh build || true

          echo
          echo "Build tree:"
          find build \
            -maxdepth 2 \
            -type f \
            -print \
            | sort \
            | head -300

          echo
          echo "Memory:"
          free -h

      # ============================================================
      # DETECT CHANGED C/C++ FILES
      # ============================================================

      - name: Detect changed C/C++ files
        id: cpp_changes
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DETECTING CHANGED C/C++ FILES"
          echo "============================================================"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                -n "${{ inputs.base_sha }}" ]]; then

            echo "Using manually supplied base SHA:"
            echo "${{ inputs.base_sha }}"

            if ! git rev-parse --verify \
              "${{ inputs.base_sha }}^{commit}" \
              >/dev/null 2>&1; then

              echo "::error::Invalid base_sha:"
              echo "${{ inputs.base_sha }}"

              exit 1
            fi

            base_ref="${{ inputs.base_sha }}"

          else

            default_branch="${{ github.event.repository.default_branch }}"

            echo "Default branch:"
            echo "$default_branch"

            git fetch \
              --no-tags \
              origin \
              "$default_branch:refs/remotes/origin/$default_branch"

            base_ref="$(
              git merge-base \
                HEAD \
                "origin/$default_branch"
            )"

          fi

          echo
          echo "Base commit:"
          echo "$base_ref"

          echo
          echo "Current commit:"
          git rev-parse HEAD

          mapfile -t changed_files < <(
            git diff \
              --name-only \
              --diff-filter=ACMR \
              "$base_ref" \
              HEAD \
              -- \
              '*.c' \
              '*.cc' \
              '*.cpp' \
              '*.cxx' \
              '*.h' \
              '*.hh' \
              '*.hpp' \
              '*.hxx' \
            | sed '/^[[:space:]]*$/d'
          )

          echo
          echo "Number of changed C/C++ files:"
          echo "${#changed_files[@]}"

          if [[ "${#changed_files[@]}" -eq 0 ]]; then

            echo "has_changes=false" \
              >> "$GITHUB_OUTPUT"

            echo
            echo "No C/C++ changes detected."

            exit 0
          fi

          echo
          echo "Changed C/C++ files:"
          printf '  %s\n' "${changed_files[@]}"

          printf '%s\n' "${changed_files[@]}" \
            > build/changed_cxx_files.txt

          cp \
            build/changed_cxx_files.txt \
            build/changed_cpp_files.txt

          echo "has_changes=true" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # LOG CHANGE DETECTION
      # ============================================================

      - name: Log changed files
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CHANGED C/C++ FILES"
          echo "============================================================"

          nl -ba build/changed_cxx_files.txt

          echo
          echo "File count:"
          wc -l build/changed_cxx_files.txt

      # ============================================================
      # BUILD PCH
      #
      # IMPORTANT:
      # This must occur after change detection because this step
      # uses steps.cpp_changes.outputs.has_changes.
      #
      # This builds ONLY the PCH target.
      # ============================================================

      - name: Build precompiled headers
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING PRECOMPILED HEADERS"
          echo "============================================================"

          echo "Memory before PCH:"
          free -h

          echo
          echo "PCH target:"
          echo "pch"

          echo
          echo "Build command:"
          echo "cmake --build build --target pch --config RelWithDebInfo --parallel 1"

          cmake --build build \
            --target pch \
            --config RelWithDebInfo \
            --parallel 1 \
            --verbose

          echo
          echo "PCH build completed."

          echo
          echo "PCH files:"
          find build \
            -type f \
            \( \
              -name "*.pch" \
              -o -name "cmake_pch.hxx" \
              -o -name "cmake_pch.cxx" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Memory after PCH:"
          free -h

      # ============================================================
      # LOG COMPILE DATABASE
      # ============================================================

      - name: Inspect compile database
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMPILE DATABASE"
          echo "============================================================"

          if [[ ! -f build/compile_commands.json ]]; then

            echo "::error::compile_commands.json does not exist."

            exit 1
          fi

          echo "Compile database:"
          ls -lh build/compile_commands.json

          echo
          echo "Number of compile commands:"

          python - <<'PY'
          import json

          with open("build/compile_commands.json") as f:
              commands = json.load(f)

          print(len(commands))
          PY

          echo
          echo "PCH references:"
          grep -o \
            'cmake_pch[^" ]*' \
            build/compile_commands.json \
            | sort \
            | uniq \
            | head -50 \
            || true

      # ============================================================
      # COMPILE CHANGED FILES
      # ============================================================

      - name: Compile changed C/C++ files
        id: compile_changed
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import shlex
          import subprocess
          import tempfile
          from pathlib import Path

          repo = Path(
              os.environ["GITHUB_WORKSPACE"]
          ).resolve()

          build = (
              repo / "build"
          ).resolve()

          source_suffixes = {
              ".c",
              ".cc",
              ".cpp",
              ".cxx",
          }

          header_suffixes = {
              ".h",
              ".hh",
              ".hpp",
              ".hxx",
          }

          print("=" * 60)
          print("SELECTIVE C/C++ COMPILATION")
          print("=" * 60)

          changed_files = []

          for line in (
              build / "changed_cxx_files.txt"
          ).read_text().splitlines():

              line = line.strip()

              if not line:
                  continue

              path = (
                  repo / line
              ).resolve()

              if not path.exists():

                  print(
                      f"WARNING: changed file does not exist: "
                      f"{line}"
                  )

                  continue

              changed_files.append(path)

          print(
              f"Changed files to process: "
              f"{len(changed_files)}"
          )

          compile_db_path = (
              build / "compile_commands.json"
          )

          if not compile_db_path.exists():

              raise RuntimeError(
                  "compile_commands.json does not exist"
              )

          compile_db = json.loads(
              compile_db_path.read_text()
          )

          print(
              f"Compile database entries: "
              f"{len(compile_db)}"
          )

          def resolve_entry_path(entry):

              path = Path(entry["file"])

              if not path.is_absolute():

                  path = (
                      Path(entry["directory"]) /
                      path
                  )

              return path.resolve()

          entry_by_file = {
              resolve_entry_path(entry): entry
              for entry in compile_db
          }

          def command_from_entry(entry):

              if "arguments" in entry:

                  return list(
                      entry["arguments"]
                  )

              if "command" in entry:

                  return shlex.split(
                      entry["command"]
                  )

              raise RuntimeError(
                  "Compile entry has neither "
                  "'arguments' nor 'command'"
              )

          def remove_output_flags(command):

              result = []

              index = 0

              while index < len(command):

                  argument = command[index]

                  if argument in (
                      "-o",
                      "-MF",
                      "-MT",
                  ):

                      index += 2
                      continue

                  if (
                      argument.startswith("-MF")
                      or
                      argument.startswith("-MT")
                  ):

                      index += 1
                      continue

                  result.append(argument)

                  index += 1

              return result

          def replace_source(
              command,
              original,
              replacement,
              workdir,
          ):

              original = original.resolve()

              for index, argument in enumerate(command):

                  if argument.startswith("-"):

                      continue

                  candidate = Path(argument)

                  if not candidate.is_absolute():

                      candidate = (
                          workdir / candidate
                      ).resolve()

                  else:

                      candidate = (
                          candidate.resolve()
                      )

                  if candidate == original:

                      command[index] = str(
                          replacement
                      )

                      return True

              return False

          source_files = [
              path
              for path in changed_files
              if path.suffix.lower()
              in source_suffixes
          ]

          header_files = [
              path
              for path in changed_files
              if path.suffix.lower()
              in header_suffixes
          ]

          print()
          print(
              f"Source files: {len(source_files)}"
          )

          print(
              f"Header files: {len(header_files)}"
          )

          # --------------------------------------------------------
          # Compile source files
          # --------------------------------------------------------

          for source in source_files:

              print()
              print("-" * 60)
              print(
                  "SOURCE:",
                  source.relative_to(repo),
              )
              print("-" * 60)

              entry = entry_by_file.get(
                  source
              )

              if entry is None:

                  raise RuntimeError(
                      "No compile database entry for "
                      f"{source}"
                  )

              command = command_from_entry(
                  entry
              )

              workdir = Path(
                  entry["directory"]
              ).resolve()

              print(
                  "Working directory:",
                  workdir,
              )

              print()
              print(
                  "Compile command:"
              )

              print(
                  " ".join(
                      shlex.quote(x)
                      for x in command
                  )
              )

              result = subprocess.run(
                  command,
                  cwd=workdir,
              )

              if result.returncode != 0:

                  print()
                  print(
                      "::error::Compilation failed:"
                  )

                  print(
                      source.relative_to(repo)
                  )

                  raise SystemExit(
                      result.returncode
                  )

              print(
                  "Compilation successful."
              )

          # --------------------------------------------------------
          # Find compile command for headers
          # --------------------------------------------------------

          def choose_header_command(
              header_path
          ):

              candidates = []

              for entry in compile_db:

                  source_path = (
                      resolve_entry_path(
                          entry
                      )
                  )

                  if (
                      source_path.suffix.lower()
                      not in source_suffixes
                  ):

                      continue

                  try:

                      relative = (
                          header_path.relative_to(
                              source_path.parent
                          )
                      )

                      distance = len(
                          relative.parts
                      )

                  except ValueError:

                      distance = 9999

                  same_directory = (
                      header_path.parent
                      ==
                      source_path.parent
                  )

                  score = (
                      0 if same_directory else 1,
                      distance,
                      str(source_path),
                  )

                  candidates.append(
                      (score, entry)
                  )

              if not candidates:

                  return None

              candidates.sort(
                  key=lambda item: item[0]
              )

              return candidates[0][1]

          # --------------------------------------------------------
          # Validate headers
          # --------------------------------------------------------

          for header in header_files:

              print()
              print("-" * 60)
              print(
                  "HEADER:",
                  header.relative_to(repo),
              )
              print("-" * 60)

              entry = choose_header_command(
                  header
              )

              if entry is None:

                  raise RuntimeError(
                      "Could not find compile command "
                      f"for {header}"
                  )

              command = remove_output_flags(
                  command_from_entry(entry)
              )

              workdir = Path(
                  entry["directory"]
              ).resolve()

              source_path = resolve_entry_path(
                  entry
              )

              with tempfile.NamedTemporaryFile(
                  mode="w",
                  suffix=".cpp",
                  dir=str(header.parent),
                  delete=False,
                  encoding="utf-8",
              ) as temporary_file:

                  temporary_file.write(
                      f'#include "{header.name}"\n'
                  )

                  wrapper = Path(
                      temporary_file.name
                  ).resolve()

              try:

                  replaced = replace_source(
                      command,
                      source_path,
                      wrapper,
                      workdir,
                  )

                  if not replaced:

                      command.append(
                          str(wrapper)
                      )

                  if (
                      "-fsyntax-only"
                      not in command
                  ):

                      command.append(
                          "-fsyntax-only"
                      )

                  print(
                      "Header validation command:"
                  )

                  print(
                      " ".join(
                          shlex.quote(x)
                          for x in command
                      )
                  )

                  result = subprocess.run(
                      command,
                      cwd=workdir,
                  )

                  if result.returncode != 0:

                      print(
                          "::error::Header validation "
                          "failed."
                      )

                      raise SystemExit(
                          result.returncode
                      )

                  print(
                      "Header validation successful."
                  )

              finally:

                  try:
                      wrapper.unlink()

                  except FileNotFoundError:
                      pass

          print()
          print("=" * 60)
          print("SELECTIVE COMPILATION COMPLETE")
          print("=" * 60)

          PY

      # ============================================================
      # CMAKE TARGET LIST
      # ============================================================

      - name: List CMake targets
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CMAKE TARGETS"
          echo "============================================================"

          cmake --build build \
            --target help \
            > build/cmake_targets.txt

          cat build/cmake_targets.txt

          echo
          echo "Potential Python targets:"

          grep -Ei \
            'python|pybind|extension|module|asset' \
            build/cmake_targets.txt \
            | head -200 \
            || true

      # ============================================================
      # FIND PYTHON EXTENSION TARGET
      # ============================================================

      - name: Find Python extension target
        id: python_target
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINDING PYTHON EXTENSION TARGET"
          echo "============================================================"

          python - <<'PY'
          import re
          from pathlib import Path

          target_file = Path(
              "build/cmake_targets.txt"
          )

          text = target_file.read_text()

          targets = []

          for line in text.splitlines():

              match = re.search(
                  r'^\.\.\. ([A-Za-z0-9_.+-]+)',
                  line,
              )

              if not match:
                  continue

              target = match.group(1)
              lower = target.lower()

              if any(
                  token in lower
                  for token in (
                      "python",
                      "pybind",
                      "extension",
                  )
              ):

                  if target not in targets:
                      targets.append(target)

          print("Candidate Python extension targets:")

          for target in targets:
              print(f"  {target}")

          if not targets:

              print(
                  "::error::No Python extension target "
                  "could be identified."
              )

              print()
              print(
                  "Complete target list:"
              )

              print(text)

              raise SystemExit(1)

          if len(targets) > 1:

              print()
              print(
                  "::error::More than one possible "
                  "Python extension target was found."
              )

              print(
                  "The workflow will not guess."
              )

              print()
              print(
                  "Candidates:"
              )

              for target in targets:
                  print(
                      f"  {target}"
                  )

              raise SystemExit(1)

          target = targets[0]

          Path(
              "build/python_extension_target.txt"
          ).write_text(
              target + "\n"
          )

          print()
          print(
              "Selected Python extension target:"
          )

          print(target)

          PY

          target="$(
            cat build/python_extension_target.txt
          )"

          echo "target=$target" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # BUILD PYTHON EXTENSION
      #
      # THIS IS THE ONLY FULL CMAKE TARGET BUILD.
      #
      # Dependencies required by this target may still be built,
      # but unrelated development libraries are not requested.
      # ============================================================

      - name: Build Python extension
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          target="${{ steps.python_target.outputs.target }}"

          echo "============================================================"
          echo "BUILDING PYTHON EXTENSION"
          echo "============================================================"

          echo "Selected target:"
          echo "$target"

          echo
          echo "Memory before build:"
          free -h

          echo
          echo "Disk before build:"
          df -h .

          echo
          echo "Build command:"
          echo "cmake --build build --target $target --config RelWithDebInfo --parallel 1 --verbose"

          echo
          echo "Starting build..."

          cmake --build build \
            --target "$target" \
            --config RelWithDebInfo \
            --parallel 1 \
            --verbose

          echo
          echo "Python extension target completed."

          echo
          echo "Memory after build:"
          free -h

          echo
          echo "Disk after build:"
          df -h .

      # ============================================================
      # DEBUG BUILD OUTPUT
      # ============================================================

      - name: Inspect build outputs
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILD OUTPUT INSPECTION"
          echo "============================================================"

          echo "Selected target:"
          cat build/python_extension_target.txt

          echo
          echo "All shared libraries:"
          find build \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.so.*" \
              -o -name "*.pyd" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "All libraries:"
          find build \
            -type f \
            \( \
              -name "*.a" \
              -o -name "*.so" \
              -o -name "*.so.*" \
              -o -name "*.pyd" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Recently modified build files:"
          find build \
            -type f \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -200 \
            || true

          echo
          echo "Build directory size:"
          du -sh build

          echo
          echo "Largest build directories:"
          du -h \
            --max-depth=2 \
            build \
            | sort -h \
            | tail -50 \
            || true

      # ============================================================
      # PREPARE PYTHON EXTENSIONS
      # ============================================================

      - name: Prepare Python extensions
        id: binaries
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SEARCHING FOR PYTHON EXTENSIONS"
          echo "============================================================"

          rm -rf dist
          mkdir -p dist

          echo
          echo "All .so/.pyd files in build tree:"

          find build \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.so.*" \
              -o -name "*.pyd" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Python extension candidates:"

          mapfile -t extensions < <(
            find build \
              -type f \
              \( \
                -name "*.so" \
                -o -name "*.pyd" \
              \) \
              -print \
              | sort \
              | grep -E \
                '(\.cpython-[0-9]+.*\.so$|\.abi3\.so$|\.pyd$)' \
              || true
          )

          echo
          echo "Number of candidates:"
          echo "${#extensions[@]}"

          if [[ "${#extensions[@]}" -eq 0 ]]; then

            echo
            echo "::error::No Python extension binaries were found."

            echo
            echo "Selected target:"
            cat build/python_extension_target.txt \
              || true

            echo
            echo "CMake targets:"
            cat build/cmake_targets.txt \
              || true

            echo
            echo "Complete build tree:"
            find build \
              -type f \
              -print \
              | sort \
              | head -1000

            echo
            echo "Possible shared libraries:"
            find build \
              -type f \
              \( \
                -name "*.so" \
                -o -name "*.so.*" \
                -o -name "*.dylib" \
                -o -name "*.dll" \
              \) \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo
          echo "Found Python extension candidates:"

          for extension in "${extensions[@]}"; do
            echo "  $extension"
          done

          echo
          echo "Copying extensions to dist/:"

          for extension in "${extensions[@]}"; do

            filename="$(
              basename "$extension"
            )"

            echo
            echo "Source:"
            echo "  $extension"

            echo "Destination:"
            echo "  dist/$filename"

            cp -f \
              "$extension" \
              "dist/$filename"

          done

          echo
          echo "Final dist directory:"

          find dist \
            -type f \
            -ls

          echo
          echo "dist size:"
          du -sh dist

          echo "has_binaries=true" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # VERIFY PYTHON EXTENSIONS
      # ============================================================

      - name: Verify Python extensions
        if: steps.binaries.outputs.has_binaries == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING PYTHON EXTENSIONS"
          echo "============================================================"

          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          dist = Path("dist")

          extensions = sorted(
              path
              for path in dist.iterdir()
              if path.is_file()
              and (
                  path.name.endswith(".so")
                  or path.name.endswith(".pyd")
              )
          )

          print(
              "Python executable:"
          )

          print(
              sys.executable
          )

          print()
          print(
              "Python version:"
          )

          print(
              sys.version
          )

          print()
          print(
              "Extensions found:"
          )

          for extension in extensions:
              print(
                  f"  {extension}"
              )

          if not extensions:

              raise SystemExit(
                  "No Python extensions found."
              )

          for extension in extensions:

              filename = extension.name

              if ".cpython-" in filename:

                  module_name = filename.split(
                      ".cpython-",
                      1,
                  )[0]

              elif ".abi3." in filename:

                  module_name = filename.split(
                      ".abi3.",
                      1,
                  )[0]

              else:

                  module_name = filename.rsplit(
                      ".",
                      1,
                  )[0]

              print()
              print("-" * 60)
              print(
                  f"Testing: {filename}"
              )
              print(
                  f"Module:  {module_name}"
              )
              print("-" * 60)

              spec = (
                  importlib.util.spec_from_file_location(
                      module_name,
                      extension,
                  )
              )

              if spec is None:

                  raise SystemExit(
                      "Could not create import spec for "
                      f"{extension}"
                  )

              module = (
                  importlib.util.module_from_spec(
                      spec
                  )
              )

              try:

                  spec.loader.exec_module(
                      module
                  )

              except Exception as exc:

                  print(
                      "::error::Python failed to load "
                      f"{filename}"
                  )

                  print(
                      f"Exception type: "
                      f"{type(exc).__name__}"
                  )

                  print(
                      f"Exception: {exc}"
                  )

                  raise

              print(
                  "SUCCESS: extension loaded."
              )

          print()
          print(
              "=" * 60
          )

          print(
              "ALL PYTHON EXTENSIONS LOADED SUCCESSFULLY"
          )

          print(
              "=" * 60
          )

          PY

      # ============================================================
      # VERIFY ARTIFACTS
      # ============================================================

      - name: Verify selective build artifacts
        id: verify_artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL ARTIFACT VERIFICATION"
          echo "============================================================"

          echo "CMake compile database:"
          if [[ -f build/compile_commands.json ]]; then
            echo "  PASS"
          else
            echo "  FAIL"
            exit 1
          fi

          if [[ "${{ steps.cpp_changes.outputs.has_changes }}" != "true" ]]; then

            echo
            echo "No C/C++ changes were detected."
            echo "Nothing else to verify."

            exit 0
          fi

          echo
          echo "Changed-file list:"
          if [[ -f build/changed_cxx_files.txt ]]; then
            echo "  PASS"
          else
            echo "  FAIL"
            exit 1
          fi

          echo
          echo "Python target:"
          if [[ -f build/python_extension_target.txt ]]; then
            echo "  PASS"
            cat build/python_extension_target.txt
          else
            echo "  FAIL"
            exit 1
          fi

          echo
          echo "dist directory:"
          if [[ -d dist ]]; then
            echo "  PASS"
          else
            echo "  FAIL"
            exit 1
          fi

          echo
          echo "Python extensions:"

          mapfile -t extension_files < <(
            find dist \
              -type f \
              \( \
                -name "*.so" \
                -o -name "*.pyd" \
              \) \
              -print
          )

          if [[ "${#extension_files[@]}" -eq 0 ]]; then

            echo "  FAIL"
            echo "::error::No Python extensions found in dist/."

            echo
            echo "dist contents:"
            find dist \
              -type f \
              -print \
              || true

            exit 1
          fi

          for file in "${extension_files[@]}"; do
            echo "  PASS: $file"
          done

          echo
          echo "Final artifact sizes:"
          du -h dist/*

          echo
          echo "Artifact verification successful."

      # ============================================================
      # CCACHE STATISTICS
      # ============================================================

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "CCACHE STATISTICS"
          echo "============================================================"

          ccache --show-stats || true

      # ============================================================
      # FINAL SYSTEM INFORMATION
      # ============================================================

      - name: Print final resource usage
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "FINAL RESOURCE USAGE"
          echo "============================================================"

          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "Build size:"
          du -sh build 2>/dev/null || true

          echo
          echo "Dist size:"
          du -sh dist 2>/dev/null || true

      # ============================================================
      # COMMIT PYTHON EXTENSIONS
      # ============================================================

      - name: Commit updated Python extensions
        if: >
          steps.binaries.outputs.has_binaries == 'true' &&
          steps.verify_artifacts.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMMITTING PYTHON EXTENSIONS"
          echo "============================================================"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Current branch:"
          git branch --show-current

          echo
          echo "Current commit:"
          git rev-parse HEAD

          echo
          echo "Generated extensions:"
          find dist \
            -type f \
            -print \
            | sort

          echo
          echo "Git status before staging:"
          git status --short

          git add -f dist/

          echo
          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then

            echo
            echo "No binary changes detected."
            echo "Nothing to commit."

            exit 0
          fi

          echo
          echo "Staged changes:"
          git diff \
            --cached \
            --stat

          echo
          echo "Creating commit..."

          git commit \
            -m "chore: update compiled Python extensions [skip ci]"

          echo
          echo "Pushing commit..."

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"

          echo
          echo "Python extensions committed successfully."

      # ============================================================
      # FAILURE DIAGNOSTICS
      # ============================================================

      - name: Dump failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "============================================================"
          echo "FAILURE DIAGNOSTICS"
          echo "============================================================"

          echo
          echo "Git:"
          git status --short || true
          git rev-parse HEAD || true

          echo
          echo "Memory:"
          free -h || true

          echo
          echo "Disk:"
          df -h || true

          echo
          echo "Build directory:"
          du -sh build 2>/dev/null || true

          echo
          echo "Selected Python target:"
          cat build/python_extension_target.txt \
            2>/dev/null \
            || true

          echo
          echo "Changed C/C++ files:"
          cat build/changed_cxx_files.txt \
            2>/dev/null \
            || true

          echo
          echo "CMake targets:"
          cat build/cmake_targets.txt \
            2>/dev/null \
            || true

          echo
          echo "Shared libraries:"
          find build \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.so.*" \
              -o -name "*.pyd" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "PCH files:"
          find build \
            -type f \
            \( \
              -name "*.pch" \
              -o -name "cmake_pch.hxx" \
              -o -name "cmake_pch.cxx" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Recent build files:"
          find build \
            -type f \
            -printf '%T@ %p\n' \
            2>/dev/null \
            | sort -nr \
            | head -300 \
            || true

          echo
          echo "dist:"
          find dist \
            -type f \
            -print \
            2>/dev/null \
            || true

          echo
          echo "ccache:"
          ccache --show-stats \
            2>/dev/null \
            || true

          echo
          echo "============================================================"
          echo "END FAILURE DIAGNOSTICS"
          echo "============================================================"
