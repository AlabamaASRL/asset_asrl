name: Build C++ development target

on:
  push:
    branches:
      - kurelowech_pines

  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit SHA to diff against for selective C++ builds
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: C++ build - Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Ubuntu dependencies
        env:
          COMPILER: clang-13
        run: bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-22.04-clang-13
          max-size: 2G

      - name: Install Python build requirements
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      - name: Configure CMake
        run: |
          cmake -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPIP_INSTALL=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      - name: Detect changed C++ files
        id: cpp_changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                -n "${{ inputs.base_sha }}" ]]; then

            if ! git rev-parse --verify "${{ inputs.base_sha }}^{commit}" >/dev/null 2>&1; then
              echo "::error::Invalid base_sha: ${{ inputs.base_sha }}"
              exit 1
            fi

            base_ref="${{ inputs.base_sha }}"

          else
            default_branch="${{ github.event.repository.default_branch }}"

            git fetch --no-tags origin \
              "$default_branch:refs/remotes/origin/$default_branch"

            if ! git rev-parse --verify "origin/$default_branch" >/dev/null 2>&1; then
              echo "::error::Unable to find origin/$default_branch"
              exit 1
            fi

            base_ref="$(git merge-base HEAD "origin/$default_branch")"
          fi

          echo "Current commit: ${{ github.sha }}"
          echo "Base commit:    $base_ref"

          mapfile -t changed_cpp < <(
            git diff --name-only --diff-filter=ACMR \
              "$base_ref" "${{ github.sha }}" \
              -- '*.cpp' '*.cc' '*.cxx' \
            | sed '/^[[:space:]]*$/d'
          )

          if [[ "${#changed_cpp[@]}" -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No C++ source changes detected."
            exit 0
          fi

          echo "Changed C++ files:"
          printf '%s\n' "${changed_cpp[@]}"

          printf '%s\n' "${changed_cpp[@]}" > build/changed_cpp_files.txt

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Compile changed C++ files
        id: compile_changed
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import shlex
          import subprocess
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          build = (repo / "build").resolve()

          changed_files = []
          missing = []

          for line in (build / "changed_cpp_files.txt").read_text().splitlines():
              line = line.strip()

              if not line:
                  continue

              src = (repo / line).resolve()

              if src.exists():
                  changed_files.append(src)

          compile_db = json.loads(
              (build / "compile_commands.json").read_text()
          )

          entry_by_file = {}

          for entry in compile_db:
              file_path = Path(entry["file"])

              if not file_path.is_absolute():
                  file_path = (
                      Path(entry["directory"]) / file_path
                  ).resolve()
              else:
                  file_path = file_path.resolve()

              entry_by_file[file_path] = entry

          compile_entries = []

          for src in changed_files:
              entry = entry_by_file.get(src)

              if entry is None:
                  missing.append(str(src.relative_to(repo)))
              else:
                  compile_entries.append(entry)

          if missing:
              print(
                  "::error::No compile target mapping for changed files: "
                  + ", ".join(missing)
              )
              raise SystemExit(1)

          def resolve_path(path_str, base_dir):
              path = Path(path_str)

              if not path.is_absolute():
                  return (base_dir / path).resolve()

              return path.resolve()

          def infer_target_name(path):
              match = re.search(r"/CMakeFiles/([^/]+)\.dir/", str(path))

              if match:
                  return match.group(1)

              return None

          def iter_pch_paths(cmd, base_dir):
              def add_candidate(raw_path):
                  if raw_path:
                      yield resolve_path(raw_path, base_dir)

              idx = 0

              while idx < len(cmd):
                  arg = cmd[idx]

                  if arg == "-include-pch" and idx + 1 < len(cmd):
                      yield from add_candidate(cmd[idx + 1])
                      idx += 1

                  elif arg.startswith("-include-pch="):
                      yield from add_candidate(
                          arg.split("=", 1)[1]
                      )

                  elif (
                      arg.startswith("-include-pch")
                      and arg != "-include-pch"
                  ):
                      yield from add_candidate(
                          arg[len("-include-pch"):]
                      )

                  elif arg.endswith(".pch"):
                      yield from add_candidate(arg)

                  elif arg == "-Xclang" and idx + 1 < len(cmd):
                      xclang_arg = cmd[idx + 1]

                      if xclang_arg == "-include-pch":
                          if (
                              idx + 3 < len(cmd)
                              and cmd[idx + 2] == "-Xclang"
                          ):
                              yield from add_candidate(cmd[idx + 3])
                              idx += 3
                          elif idx + 2 < len(cmd):
                              yield from add_candidate(cmd[idx + 2])
                              idx += 2

                      elif xclang_arg.startswith("-include-pch="):
                          yield from add_candidate(
                              xclang_arg.split("=", 1)[1]
                          )
                          idx += 1

                      elif (
                          xclang_arg.startswith("-include-pch")
                          and xclang_arg != "-include-pch"
                      ):
                          yield from add_candidate(
                              xclang_arg[len("-include-pch"):]
                          )
                          idx += 1

                      elif xclang_arg.endswith(".pch"):
                          yield from add_candidate(xclang_arg)
                          idx += 1

                  idx += 1

          prepared_targets = set()

          for entry in compile_entries:

              if isinstance(entry.get("arguments"), list):
                  cmd = list(entry["arguments"])

              elif entry.get("command"):
                  cmd = shlex.split(entry["command"])

              else:
                  print(
                      "::error::Compile database entry is missing "
                      "both 'arguments' and 'command'."
                  )
                  raise SystemExit(1)

              workdir = Path(entry["directory"])

              source_path = Path(entry["file"])

              if not source_path.is_absolute():
                  source_path = (
                      workdir / source_path
                  ).resolve()
              else:
                  source_path = source_path.resolve()

              for pch_path in iter_pch_paths(cmd, workdir):

                  if pch_path.exists():
                      continue

                  target_name = infer_target_name(pch_path)

                  if target_name is None:
                      print(
                          "::error::Unable to infer target for "
                          f"missing precompiled header: {pch_path}"
                      )
                      raise SystemExit(1)

                  if target_name in prepared_targets:
                      continue

                  print(
                      "Building prerequisite target:",
                      target_name
                  )

                  result = subprocess.run(
                      [
                          "cmake",
                          "--build",
                          str(build),
                          "--target",
                          target_name,
                          "--parallel",
                          "1",
                      ],
                      cwd=repo
                  )

                  if result.returncode != 0:
                      raise SystemExit(result.returncode)

                  prepared_targets.add(target_name)

              for idx, arg in enumerate(cmd):

                  if arg.startswith("-"):
                      continue

                  candidate = Path(arg)

                  if not candidate.is_absolute():
                      candidate = (
                          workdir / candidate
                      ).resolve()
                  else:
                      candidate = candidate.resolve()

                  if candidate == source_path:
                      cmd[idx] = str(source_path)

              for idx, arg in enumerate(cmd):

                  if arg not in ("-o", "-MF"):
                      continue

                  if idx + 1 >= len(cmd):
                      continue

                  out_path = cmd[idx + 1]

                  if out_path == "-":
                      continue

                  output = Path(out_path)

                  if not output.is_absolute():
                      output = (
                          workdir / output
                      ).resolve()

                  output.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

              print(
                  "Compiling:",
                  source_path.relative_to(repo)
              )

              result = subprocess.run(
                  cmd,
                  cwd=workdir
              )

              if result.returncode != 0:
                  raise SystemExit(result.returncode)

          print(
              f"Compiled {len(compile_entries)} "
              "changed C++ file(s)."
          )
          PY

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Verify selective build artifacts
        id: verify_artifacts
        if: always() && steps.cpp_changes.outcome == 'success' && steps.compile_changed.outcome != 'failure'
        shell: bash
        run: |
          if [[ ! -f build/compile_commands.json ]]; then
            echo "::error::Missing expected artifact: build/compile_commands.json"
            exit 1
          fi

          if [[ "${{ steps.cpp_changes.outputs.has_changes }}" != "true" ]]; then
            echo "No C++ source changes detected; selective build was skipped."
            exit 0
          fi

          if [[ ! -f build/changed_cpp_files.txt ]]; then
            echo "::error::Missing expected changed file list: build/changed_cpp_files.txt"
            exit 1
          fi

      - name: Upload development artifacts
        if: always() && steps.verify_artifacts.outcome == 'success' && steps.cpp_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asset-asrl-cpp-build-ubuntu-22.04
          path: |
            build/compile_commands.json
            build/changed_cpp_files.txt
          if-no-files-found: error
          retention-days: 14
