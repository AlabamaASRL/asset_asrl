name: Build C++ development target

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cpp:
    name: build-cpp (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            python-version: "3.12"
          - os: windows
            runner: windows-2022
            python-version: "3.12"

    env:
      WHEEL_DIR: build/pypiwheel/asset_asrl/dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Initialize submodules
        shell: bash
        run: git submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          COMPILER: clang-13
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran

      - name: Set up LLVM/Clang toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm --version=18.1.8 -y --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          clang --version
          cmake --version

      - name: Install MKL via pip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install mkl mkl-devel mkl-include
          if ($LASTEXITCODE -ne 0) { throw "pip install of MKL failed" }

          $prefix = (python -c "import sys; print(sys.prefix)").Trim()
          $mklRoot = Join-Path $prefix "Library"
          "MKLROOT=$mklRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ONEAPI_ROOT=$mklRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$mklRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$mklRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify MKL install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "$env:MKLROOT\include\mkl.h")) {
            throw "MKL headers not found at $env:MKLROOT\include"
          }
          Get-ChildItem "$env:MKLROOT\lib" -Filter "mkl_*.lib" | Select-Object -First 10 | ForEach-Object { $_.Name }
          Write-Host "MKL installed at $env:MKLROOT"

      - name: Install Python build deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools

      - name: Install Python build deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m build --wheel --outdir "${WHEEL_DIR}"

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheelDir = "build/pypiwheel/asset_asrl/dist"
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DPIP_INSTALL=True `
            -DBUILD_ASSET_WHEEL=True `
            -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" `
            -DCMAKE_LINKER="C:/Program Files/LLVM/bin/lld-link.exe" `
            -DCMAKE_C_COMPILER_AR="C:/Program Files/LLVM/bin/llvm-ar.exe" `
            -DCMAKE_C_COMPILER_RANLIB="C:/Program Files/LLVM/bin/llvm-ranlib.exe" `
            -DCMAKE_CXX_COMPILER_AR="C:/Program Files/LLVM/bin/llvm-ar.exe" `
            -DCMAKE_CXX_COMPILER_RANLIB="C:/Program Files/LLVM/bin/llvm-ranlib.exe"
          cmake --build build --target asset pypiwheel --config Release -- -j24
          "WHEEL_DIR=$wheelDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $wheel = Get-ChildItem -Path $wheelDir -Filter *.whl -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wheel) {
            throw "No wheel produced in $wheelDir"
          }
          "WHEEL=$($wheel.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify wheel exists (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "Looking for wheels in: ${WHEEL_DIR}"
          ls -la "${WHEEL_DIR}" || true
          WHEEL="$(find "${WHEEL_DIR}" -maxdepth 1 -type f -name '*.whl' | head -n 1)"
          if [ -z "${WHEEL}" ]; then
            echo "No wheel found in ${WHEEL_DIR}"
            echo "Debug listing of build tree:"
            find build -maxdepth 6 -type f | sort || true
            echo "Debug listing of repo tree (first 300 files):"
            find . -maxdepth 6 -type f | sort | head -n 300 || true
            exit 1
          fi
          echo "Found wheel: ${WHEEL}"
          echo "WHEEL=${WHEEL}" >> "$GITHUB_ENV"

      - name: Verify wheel exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Looking for wheels in: $env:WHEEL_DIR"
          if (Test-Path $env:WHEEL_DIR) {
            Get-ChildItem -Path $env:WHEEL_DIR -Force | Format-Table -AutoSize
          }
          $wheel = Get-ChildItem -Path $env:WHEEL_DIR -Filter *.whl -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wheel) {
            Write-Host "No wheel found in $env:WHEEL_DIR"
            Write-Host "Debug listing of build tree:"
            if (Test-Path build) {
              Get-ChildItem -Path build -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 500 | ForEach-Object { $_.FullName }
            }
            Write-Host "Debug listing of repo tree (first 300 files):"
            Get-ChildItem -Path . -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 300 | ForEach-Object { $_.FullName }
            exit 1
          }
          Write-Host "Found wheel: $($wheel.FullName)"
          "WHEEL=$($wheel.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reinstall test requirements
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade --force-reinstall -r requirements.txt
          else
            echo "requirements.txt not found at repo root"
            exit 1
          fi

      - name: Test Python imports from built wheel
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WHEEL:-}" ]; then
            echo "WHEEL env var not set"
            exit 1
          fi
          echo "Installing wheel: ${WHEEL}"
          python -m pip install --force-reinstall "${WHEEL}"
          python - <<'PY'
          import importlib
          import sys
          modules = [
              "asset_asrl*](#)`
