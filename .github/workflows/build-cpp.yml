
name: ASSET Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            clang-13 \
            ninja-build \
            cmake

      - name: Install Ubuntu dependencies
        shell: bash
        run: |
          bash install_ubuntu_dependencies.sh

      - name: Configure CMake
        shell: bash
        run: |
          export CC=clang-13
          export CXX=clang++-13

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPIP_INSTALL=True \
            -DBUILD_SPHINX_DOCS=True

      - name: Build ASSET and wheel
        shell: bash
        run: |
          cmake --build build \
            --target asset pypiwheel \
            --parallel 2

      - name: List generated wheels
        shell: bash
        run: |
          find build -type f -name "*.whl" -print

  windows:
    name: Windows Build (Clang + Ninja)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"
          directory: "C:/Program Files/LLVM"
          cached: true

      - name: Install Ninja and MKL
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja mkl-devel intel-openmp

          $pythonPrefix = python -c "import sys; print(sys.prefix)"

          Write-Host "Python prefix: $pythonPrefix"

          $mklHeader = Get-ChildItem `
            -Path $pythonPrefix `
            -Filter "mkl.h" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $mklHeader) {
            throw "mkl.h was not found under $pythonPrefix."
          }

          $mklLibs = @(
            Get-ChildItem `
              -Path $pythonPrefix `
              -Filter "*.lib" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )

          Write-Host "MKL libraries found:"
          $mklLibs |
            Where-Object { $_.Name -like "mkl_*.lib" } |
            Select-Object -ExpandProperty FullName

          $interface = $mklLibs |
            Where-Object { $_.Name -eq "mkl_intel_lp64.lib" } |
            Select-Object -First 1

          $sequential = $mklLibs |
            Where-Object { $_.Name -eq "mkl_sequential.lib" } |
            Select-Object -First 1

          $core = $mklLibs |
            Where-Object { $_.Name -eq "mkl_core.lib" } |
            Select-Object -First 1

          if (-not $interface -or -not $sequential -or -not $core) {
            throw "Required MKL libraries were not found. Review the library list above."
          }

          $includeDir = $mklHeader.DirectoryName
          $libDir = $interface.DirectoryName

          "MKLROOT=$libDir" |
            Out-File $env:GITHUB_ENV -Append

          "MKL_INCLUDE_DIRS=$includeDir" |
            Out-File $env:GITHUB_ENV -Append

          "MKL_INTERFACE_LIBRARY=$($interface.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "MKL_SEQTHR_LIBRARY=$($sequential.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "MKL_CORE_LIBRARY=$($core.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "MKL include directory: $includeDir"
          Write-Host "MKL library directory: $libDir"

      - name: Verify toolchain
        shell: pwsh
        run: |
          & "C:/Program Files/LLVM/bin/clang-cl.exe" --version
          & "C:/Program Files/LLVM/bin/lld-link.exe" --version
          cmake --version
          ninja --version
          python --version

      - name: Configure CMake
        shell: pwsh
        run: |
          $llvm = "C:/Program Files/LLVM/bin"

          cmake -S . -B build -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DPIP_INSTALL=True" `
            "-DBUILD_SPHINX_DOCS=True" `
            "-DCMAKE_C_COMPILER=$llvm/clang-cl.exe" `
            "-DCMAKE_CXX_COMPILER=$llvm/clang-cl.exe" `
            "-DCMAKE_LINKER=$llvm/lld-link.exe" `
            "-DCMAKE_C_COMPILER_RANLIB=$llvm/llvm-ranlib.exe" `
            "-DCMAKE_CXX_COMPILER_RANLIB=$llvm/llvm-ranlib.exe" `
            "-DCMAKE_C_COMPILER_AR=$llvm/llvm-ar.exe" `
            "-DCMAKE_CXX_COMPILER_AR=$llvm/llvm-ar.exe" `
            "-DMKLROOT=$env:MKLROOT" `
            "-DMKL_INCLUDE_DIRS=$env:MKL_INCLUDE_DIRS" `
            "-DMKL_INTERFACE_LIBRARY=$env:MKL_INTERFACE_LIBRARY" `
            "-DMKL_SEQTHR_LIBRARY=$env:MKL_SEQTHR_LIBRARY" `
            "-DMKL_CORE_LIBRARY=$env:MKL_CORE_LIBRARY"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE"
          }

      - name: Build ASSET and wheel
        shell: pwsh
        run: |
          cmake --build build `
            --target asset pypiwheel `
            --parallel 24

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE"
          }

      - name: List generated wheels
        shell: pwsh
        run: |
          $wheels = Get-ChildItem `
            -Path build `
            -Filter "*.whl" `
            -Recurse `
            -File

          if (-not $wheels) {
            Write-Warning "No wheel files were found under build."
          } else {
            $wheels | Select-Object -ExpandProperty FullName
          }
