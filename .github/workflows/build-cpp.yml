name: Build C++ development target

on:
  push:
    branches:
      - kurelowech_pines

  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit SHA to diff against for selective C++ builds
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: C++ build - Ubuntu 22.04
    runs-on: ubuntu-22.04

    env:
      BUILD_TYPE: RelWithDebInfo
      PYTHON_VERSION: "3.9"
      PYTHON_TARGET: asset

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: Print runner information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RUNNER INFORMATION"
          echo "============================================================"

          echo "Date:"
          date

          echo
          echo "Hostname:"
          hostname

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc
          lscpu | sed -n '1,40p'

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "============================================================"

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Print repository information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "REPOSITORY INFORMATION"
          echo "============================================================"

          echo "Repository:"
          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit information:"
          git log -1 --decorate --stat

          echo
          echo "Git status:"
          git status --short

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Print Python information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "PYTHON INFORMATION"
          echo "============================================================"

          python --version
          python -c "import sys; print('Python executable:', sys.executable)"
          python -c "import sys; print('Python prefix:', sys.prefix)"
          python -c "import sys; print('Python version:', sys.version)"

          echo
          echo "pip:"
          python -m pip --version

      # ============================================================
      # UBUNTU DEPENDENCIES
      # ============================================================

      - name: Install Ubuntu dependencies
        env:
          COMPILER: clang-13
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING UBUNTU DEPENDENCIES"
          echo "============================================================"

          bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      # ============================================================
      # COMPILER INFORMATION
      # ============================================================

      - name: Print compiler information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMPILER INFORMATION"
          echo "============================================================"

          echo "clang:"
          clang --version || true

          echo
          echo "clang++:"
          clang++ --version || true

          echo
          echo "gcc:"
          gcc --version | sed -n '1p' || true

          echo
          echo "g++:"
          g++ --version | sed -n '1p' || true

          echo
          echo "cmake:"
          cmake --version

          echo
          echo "ninja:"
          ninja --version || true

          echo
          echo "make:"
          make --version | sed -n '1p'

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-22.04-clang-13
          max-size: 2G

      - name: Print ccache information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CCACHE INFORMATION"
          echo "============================================================"

          ccache --version
          ccache --show-config || true
          ccache --show-stats || true

      # ============================================================
      # PYTHON BUILD REQUIREMENTS
      # ============================================================

      - name: Install Python build requirements
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING PYTHON REQUIREMENTS"
          echo "============================================================"

          python -m pip install --upgrade pip wheel setuptools

          python -m pip install -r requirements.txt

          echo
          echo "Installed packages:"
          python -m pip list

      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Clean CMake build directory
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CLEANING BUILD DIRECTORY"
          echo "============================================================"

          rm -rf build
          rm -rf dist

          mkdir -p build
          mkdir -p dist

          echo
          echo "Build directory:"
          ls -la build

          echo
          echo "Memory:"
          free -h

      # ============================================================
      # CMAKE CONFIGURATION
      # ============================================================

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CONFIGURING CMAKE"
          echo "============================================================"

          python_executable="$(
            python -c 'import sys; print(sys.executable)'
          )"

          echo "Python executable:"
          echo "$python_executable"

          echo
          echo "CMake command:"

          echo \
            cmake -S . \
              -B build \
              -G "Unix Makefiles" \
              -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DPIP_INSTALL=True \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DPython_EXECUTABLE="$python_executable"

          echo
          echo "Starting CMake configuration..."

          cmake -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPIP_INSTALL=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="$python_executable"

          echo
          echo "CMake configuration completed."

      # ============================================================
      # CMAKE CONFIGURATION LOGGING
      # ============================================================

      - name: Log CMake configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CMAKE CONFIGURATION"
          echo "============================================================"

          echo "CMake cache:"
          grep -E \
            '^(CMAKE_BUILD_TYPE|CMAKE_C_COMPILER|CMAKE_CXX_COMPILER|Python|PIP_INSTALL|CMAKE_GENERATOR)' \
            build/CMakeCache.txt \
            | sort \
            || true

          echo
          echo "CMake generator:"
          grep '^CMAKE_GENERATOR:' \
            build/CMakeCache.txt \
            || true

          echo
          echo "Build directory:"
          du -sh build || true

          echo
          echo "Build tree:"
          find build \
            -maxdepth 2 \
            -type f \
            -print \
            | sort \
            | sed -n '1,300p'

          echo
          echo "Memory:"
          free -h

      # ============================================================
      # DETECT CHANGED C/C++ FILES
      # ============================================================

      - name: Detect changed C/C++ files
        id: cpp_changes
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DETECTING CHANGED C/C++ FILES"
          echo "============================================================"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                -n "${{ inputs.base_sha }}" ]]; then

            echo "Using manually supplied base SHA:"
            echo "${{ inputs.base_sha }}"

            if ! git rev-parse --verify \
              "${{ inputs.base_sha }}^{commit}" \
              >/dev/null 2>&1; then

              echo "::error::Invalid base_sha:"
              echo "${{ inputs.base_sha }}"

              exit 1
            fi

            base_ref="${{ inputs.base_sha }}"

          else

            default_branch="${{ github.event.repository.default_branch }}"

            echo "Default branch:"
            echo "$default_branch"

            git fetch \
              --no-tags \
              origin \
              "$default_branch:refs/remotes/origin/$default_branch"

            base_ref="$(
              git merge-base \
                HEAD \
                "origin/$default_branch"
            )"

          fi

          echo
          echo "Base commit:"
          echo "$base_ref"

          echo
          echo "Current commit:"
          git rev-parse HEAD

          mapfile -t changed_files < <(
            git diff \
              --name-only \
              --diff-filter=ACMR \
              "$base_ref" \
              HEAD \
              -- \
              '*.c' \
              '*.cc' \
              '*.cpp' \
              '*.cxx' \
              '*.h' \
              '*.hh' \
              '*.hpp' \
              '*.hxx' \
            | sed '/^[[:space:]]*$/d'
          )

          echo
          echo "Number of changed C/C++ files:"
          echo "${#changed_files[@]}"

          if [[ "${#changed_files[@]}" -eq 0 ]]; then

            echo "has_changes=false" \
              >> "$GITHUB_OUTPUT"

            echo
            echo "No C/C++ changes detected."

            exit 0
          fi

          echo
          echo "Changed C/C++ files:"
          printf '  %s\n' "${changed_files[@]}"

          printf '%s\n' "${changed_files[@]}" \
            > build/changed_cxx_files.txt

          echo "has_changes=true" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # LOG CHANGE DETECTION
      # ============================================================

      - name: Log changed files
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CHANGED C/C++ FILES"
          echo "============================================================"

          nl -ba build/changed_cxx_files.txt

          echo
          echo "File count:"
          wc -l build/changed_cxx_files.txt

      # ============================================================
      # BUILD PCH
      #
      # This is intentionally done before the asset target.
      #
      # ASSET's C++ compile commands use the generated PCH.
      # Building the PCH separately avoids the earlier failure where
      # the compile command referenced a PCH that did not exist yet.
      # ============================================================

      - name: Build precompiled headers
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING PRECOMPILED HEADERS"
          echo "============================================================"

          echo "Memory before PCH:"
          free -h

          echo
          echo "Build command:"
          echo "cmake --build build --target pch --config ${BUILD_TYPE} --parallel 1"

          cmake --build build \
            --target pch \
            --config "${BUILD_TYPE}" \
            --parallel 1 \
            --verbose

          echo
          echo "PCH build completed."

          echo
          echo "PCH files:"
          find build \
            -type f \
            \( \
              -name "*.pch" \
              -o -name "cmake_pch.hxx" \
              -o -name "cmake_pch.cxx" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Memory after PCH:"
          free -h

      # ============================================================
      # LOG COMPILE DATABASE
      # ============================================================

      - name: Inspect compile database
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMPILE DATABASE"
          echo "============================================================"

          if [[ ! -f build/compile_commands.json ]]; then

            echo "::error::compile_commands.json does not exist."

            exit 1
          fi

          echo "Compile database:"
          ls -lh build/compile_commands.json

          echo
          echo "Number of compile commands:"

          python - <<'PY'
          import json

          with open("build/compile_commands.json") as f:
              commands = json.load(f)

          print(len(commands))
          PY

          echo
          echo "PCH references:"
          grep -o \
            'cmake_pch[^" ]*' \
            build/compile_commands.json \
            | sort \
            | uniq \
            | sed -n '1,50p' \
            || true

      # ============================================================
      # LIST CMAKE TARGETS
      # ============================================================

      - name: List CMake targets
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CMAKE TARGETS"
          echo "============================================================"

          cmake --build build \
            --target help \
            > build/cmake_targets.txt

          cat build/cmake_targets.txt

          echo
          echo "Python target selected by workflow:"
          echo "  ${PYTHON_TARGET}"

          echo
          echo "Checking that the Python target exists:"

          if grep -Eq \
            "^\\.\\.\\. ${PYTHON_TARGET}([[:space:]]|$)" \
            build/cmake_targets.txt; then

            echo "PASS: ${PYTHON_TARGET} target exists."

          else

            echo "::error::Python target '${PYTHON_TARGET}' was not found."

            echo
            echo "Available targets:"
            cat build/cmake_targets.txt

            exit 1
          fi

          echo
          echo "Important ASSET targets:"

          grep -E \
            '^\\.\\.\\. (asset|asset_extensions|astro|pch|psiopt|optimalcontrol|utils|vectorfunctions)' \
            build/cmake_targets.txt \
            || true

      # ============================================================
      # VERIFY CMAKE TARGET RELATIONSHIPS
      #
      # asset is the actual pybind11 Python module.
      # asset_extensions is only a static library dependency.
      # ============================================================

      - name: Verify Python target configuration
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING PYTHON TARGET CONFIGURATION"
          echo "============================================================"

          echo "Python target:"
          echo "  ${PYTHON_TARGET}"

          echo
          echo "Expected Python module:"
          echo "  asset"

          echo
          echo "Expected static extension library:"
          echo "  asset_extensions"

          echo
          echo "Checking src/CMakeLists.txt:"

          if grep -n \
            'pybind11_add_module(asset main.cpp)' \
            src/CMakeLists.txt; then

            echo
            echo "PASS: asset is the pybind11 module target."

          else

            echo
            echo "::error::Expected pybind11 asset target was not found."

            grep -n \
              'pybind11_add_module' \
              src/CMakeLists.txt \
              || true

            exit 1
          fi

          echo
          echo "Checking extensions/CMakeLists.txt:"

          if grep -n \
            'add_library(asset_extensions STATIC' \
            extensions/CMakeLists.txt; then

            echo
            echo "PASS: asset_extensions is a static library."

          else

            echo
            echo "WARNING: Could not verify asset_extensions declaration."

          fi

      # ============================================================
      # BUILD PYTHON EXTENSION
      #
      # IMPORTANT:
      #
      # The actual Python extension target is "asset".
      #
      # Do NOT build asset_extensions as the final target. That target
      # produces libasset_extensions.a, not the Python .so.
      #
      # CMake will automatically build only the dependencies required
      # by asset. Unrelated development targets are not requested.
      #
      # --parallel 1 keeps memory usage bounded.
      # ============================================================

      - name: Build Python extension
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING PYTHON EXTENSION"
          echo "============================================================"

          echo "Selected target:"
          echo "  ${PYTHON_TARGET}"

          echo
          echo "Memory before build:"
          free -h

          echo
          echo "Disk before build:"
          df -h .

          echo
          echo "Build command:"
          echo "cmake --build build --target ${PYTHON_TARGET} --config ${BUILD_TYPE} --parallel 1 --verbose"

          echo
          echo "Starting build..."

          cmake --build build \
            --target "${PYTHON_TARGET}" \
            --config "${BUILD_TYPE}" \
            --parallel 1 \
            --verbose

          echo
          echo "Python extension target completed."

          echo
          echo "Memory after build:"
          free -h

          echo
          echo "Disk after build:"
          df -h .

      # ============================================================
      # DEBUG BUILD OUTPUT
      # ============================================================

      - name: Inspect build outputs
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILD OUTPUT INSPECTION"
          echo "============================================================"

          echo "Python target:"
          echo "  ${PYTHON_TARGET}"

          echo
          echo "All shared libraries:"
          find build \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.so.*" \
              -o -name "*.pyd" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "All libraries:"
          find build \
            -type f \
            \( \
              -name "*.a" \
              -o -name "*.so" \
              -o -name "*.so.*" \
              -o -name "*.pyd" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "asset-related files:"
          find build \
            -type f \
            \( \
              -name "asset*.so" \
              -o -name "asset*.so.*" \
              -o -name "asset*.pyd" \
              -o -name "*asset*.a" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Recently modified build files:"
          find build \
            -type f \
            -printf '%T@ %p\n' \
            | sort -nr \
            | sed -n '1,200p' \
            || true

          echo
          echo "Build directory size:"
          du -sh build

          echo
          echo "Largest build directories:"
          du -h \
            --max-depth=2 \
            build \
            | sort -h \
            | tail -50 \
            || true

      # ============================================================
      # PREPARE PYTHON EXTENSION
      # ============================================================

      - name: Prepare Python extension
        id: binaries
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SEARCHING FOR PYTHON EXTENSION"
          echo "============================================================"

          rm -rf dist
          mkdir -p dist

          echo
          echo "Searching specifically for the asset Python extension:"

          mapfile -t extensions < <(
            find build \
              -type f \
              \( \
                -name "asset*.so" \
                -o -name "asset*.pyd" \
              \) \
              -print \
              | sort \
              | grep -E \
                '(^|/)asset[^/]*\.((cpython-[0-9]+[^/]*)|abi3)\.so$|(^|/)asset[^/]*\.pyd$' \
              || true
          )

          echo
          echo "Number of asset Python extension candidates:"
          echo "${#extensions[@]}"

          if [[ "${#extensions[@]}" -eq 0 ]]; then

            echo
            echo "::error::No asset Python extension binary was found."

            echo
            echo "Expected target:"
            echo "${PYTHON_TARGET}"

            echo
            echo "Expected output similar to:"
            echo "  build/src/asset.cpython-39-x86_64-linux-gnu.so"

            echo
            echo "All shared libraries:"
            find build \
              -type f \
              \( \
                -name "*.so" \
                -o -name "*.so.*" \
                -o -name "*.pyd" \
              \) \
              -print \
              | sort \
              || true

            echo
            echo "All libraries:"
            find build \
              -type f \
              \( \
                -name "*.a" \
                -o -name "*.so" \
                -o -name "*.so.*" \
                -o -name "*.pyd" \
              \) \
              -print \
              | sort \
              || true

            echo
            echo "Complete build tree:"
            find build \
              -type f \
              -print \
              | sort \
              | sed -n '1,1000p'

            exit 1
          fi

          echo
          echo "Found Python extension candidates:"

          for extension in "${extensions[@]}"; do
            echo "  $extension"
          done

          if [[ "${#extensions[@]}" -gt 1 ]]; then

            echo
            echo "WARNING: Multiple asset Python extensions were found."

            echo "The workflow will copy all matching extensions."

          fi

          echo
          echo "Copying extensions to dist/:"

          for extension in "${extensions[@]}"; do

            filename="$(
              basename "$extension"
            )"

            echo
            echo "Source:"
            echo "  $extension"

            echo "Destination:"
            echo "  dist/$filename"

            cp -f \
              "$extension" \
              "dist/$filename"

          done

          echo
          echo "Final dist directory:"

          find dist \
            -type f \
            -ls

          echo
          echo "dist size:"
          du -sh dist

          echo "has_binaries=true" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # VERIFY PYTHON EXTENSION
      # ============================================================

      - name: Verify Python extension
        if: steps.binaries.outputs.has_binaries == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING PYTHON EXTENSION"
          echo "============================================================"

          echo "Python executable:"
          python -c "import sys; print(sys.executable)"

          echo
          echo "Python version:"
          python --version

          echo
          echo "dist contents:"
          find dist \
            -type f \
            -ls

          echo
          echo "Dynamic dependencies:"

          for extension in dist/*.so dist/*.pyd; do

            if [[ ! -f "$extension" ]]; then
              continue
            fi

            echo
            echo "------------------------------------------------------------"
            echo "ldd: $extension"
            echo "------------------------------------------------------------"

            ldd "$extension" || true

          done

          echo
          echo "Testing import of asset..."

          PYTHONPATH="${GITHUB_WORKSPACE}/dist:${PYTHONPATH:-}" \
            python - <<'PY'
          import sys

          print("Python executable:")
          print(sys.executable)

          print()
          print("Python version:")
          print(sys.version)

          print()
          print("Python path:")
          for path in sys.path:
              print("  ", path)

          print()
          print("Importing asset...")

          import asset

          print()
          print("PASS: import asset")

          print()
          print("asset module:")
          print(asset)

          print()
          print("asset file:")
          print(asset.__file__)

          print()
          print("Checking expected symbols:")

          print(
              "  SoftwareInfo:",
              hasattr(asset, "SoftwareInfo"),
          )

          print(
              "  PyMain:",
              hasattr(asset, "PyMain"),
          )

          print()
          print("asset import verification successful.")
          PY

      # ============================================================
      # VERIFY ARTIFACTS
      # ============================================================

      - name: Verify selective build artifacts
        id: verify_artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL ARTIFACT VERIFICATION"
          echo "============================================================"

          echo "CMake compile database:"
          if [[ -f build/compile_commands.json ]]; then
            echo "  PASS"
          else
            echo "  FAIL"
            exit 1
          fi

          if [[ "${{ steps.cpp_changes.outputs.has_changes }}" != "true" ]]; then

            echo
            echo "No C/C++ changes were detected."
            echo "Nothing else to verify."

            exit 0
          fi

          echo
          echo "Changed-file list:"
          if [[ -f build/changed_cxx_files.txt ]]; then
            echo "  PASS"
          else
            echo "  FAIL"
            exit 1
          fi

          echo
          echo "Python target:"
          echo "  ${PYTHON_TARGET}"

          echo
          echo "dist directory:"
          if [[ -d dist ]]; then
            echo "  PASS"
          else
            echo "  FAIL"
            exit 1
          fi

          echo
          echo "Python extensions:"

          mapfile -t extension_files < <(
            find dist \
              -type f \
              \( \
                -name "asset*.so" \
                -o -name "asset*.pyd" \
              \) \
              -print
          )

          if [[ "${#extension_files[@]}" -eq 0 ]]; then

            echo "  FAIL"
            echo "::error::No asset Python extensions found in dist/."

            echo
            echo "dist contents:"
            find dist \
              -type f \
              -print \
              || true

            exit 1
          fi

          for file in "${extension_files[@]}"; do
            echo "  PASS: $file"
          done

          echo
          echo "Final artifact sizes:"
          du -h dist/*

          echo
          echo "Artifact verification successful."

      # ============================================================
      # CCACHE STATISTICS
      # ============================================================

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "CCACHE STATISTICS"
          echo "============================================================"

          ccache --show-stats || true

      # ============================================================
      # FINAL SYSTEM INFORMATION
      # ============================================================

      - name: Print final resource usage
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "FINAL RESOURCE USAGE"
          echo "============================================================"

          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "Build size:"
          du -sh build 2>/dev/null || true

          echo
          echo "Dist size:"
          du -sh dist 2>/dev/null || true

      # ============================================================
      # COMMIT PYTHON EXTENSION
      # ============================================================

      - name: Commit updated Python extensions
        if: >
          steps.binaries.outputs.has_binaries == 'true' &&
          steps.verify_artifacts.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMMITTING PYTHON EXTENSIONS"
          echo "============================================================"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Current branch:"
          git branch --show-current

          echo
          echo "Current commit:"
          git rev-parse HEAD

          echo
          echo "Generated extensions:"
          find dist \
            -type f \
            -print \
            | sort

          echo
          echo "Git status before staging:"
          git status --short

          # Only stage the generated Python extension binaries.
          git add -f \
            dist/asset*.so \
            dist/asset*.pyd \
            2>/dev/null \
            || true

          echo
          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then

            echo
            echo "No binary changes detected."
            echo "Nothing to commit."

            exit 0
          fi

          echo
          echo "Staged changes:"
          git diff \
            --cached \
            --stat

          echo
          echo "Creating commit..."

          git commit \
            -m "chore: update compiled Python extensions [skip ci]"

          echo
          echo "Pushing commit..."

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"

          echo
          echo "Python extensions committed successfully."

      # ============================================================
      # FAILURE DIAGNOSTICS
      # ============================================================

      - name: Dump failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "============================================================"
          echo "FAILURE DIAGNOSTICS"
          echo "============================================================"

          echo
          echo "Git:"
          git status --short || true
          git rev-parse HEAD || true

          echo
          echo "Memory:"
          free -h || true

          echo
          echo "Disk:"
          df -h || true

          echo
          echo "Build directory:"
          du -sh build 2>/dev/null || true

          echo
          echo "Python target:"
          echo "${PYTHON_TARGET}"

          echo
          echo "Changed C/C++ files:"
          cat build/changed_cxx_files.txt \
            2>/dev/null \
            || true

          echo
          echo "CMake targets:"
          cat build/cmake_targets.txt \
            2>/dev/null \
            || true

          echo
          echo "Shared libraries:"
          find build \
            -type f \
            \( \
              -name "*.so" \
              -o -name "*.so.*" \
              -o -name "*.pyd" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Static libraries:"
          find build \
            -type f \
            -name "*.a" \
            -print \
            | sort \
            || true

          echo
          echo "asset-related files:"
          find build \
            -type f \
            \( \
              -name "asset*.so" \
              -o -name "asset*.so.*" \
              -o -name "asset*.pyd" \
              -o -name "*asset*.a" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "PCH files:"
          find build \
            -type f \
            \( \
              -name "*.pch" \
              -o -name "cmake_pch.hxx" \
              -o -name "cmake_pch.cxx" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Recent build files:"
          find build \
            -type f \
            -printf '%T@ %p\n' \
            2>/dev/null \
            | sort -nr \
            | sed -n '1,300p' \
            || true

          echo
          echo "dist:"
          find dist \
            -type f \
            -print \
            2>/dev/null \
            || true

          echo
          echo "ccache:"
          ccache --show-stats \
            2>/dev/null \
            || true

          echo
          echo "============================================================"
          echo "END FAILURE DIAGNOSTICS"
          echo "============================================================"
