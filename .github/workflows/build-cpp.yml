name: Build C++ development target

on:
  push:
    branches:
      - kurelowech_pines
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: C++ build - Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Ubuntu dependencies
        env:
          COMPILER: clang-13
        run: bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-22.04-clang-13
          max-size: 2G

      - name: Install Python build requirements
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      - name: Configure CMake
        run: |
          cmake -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPIP_INSTALL=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      - name: Detect changed C++ files
        id: cpp_changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_ref="${{ github.event.before }}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            base_ref="HEAD~1"
          else
            base_ref="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t changed_cpp < <(
            git diff --name-only "$base_ref" "${{ github.sha }}" \
              -- '*.cpp' '*.cc' '*.cxx' \
            | sed '/^[[:space:]]*$/d'
          )

          if [[ "${#changed_cpp[@]}" -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No C++ source changes detected."
            exit 0
          fi

          printf '%s\n' "${changed_cpp[@]}" | tee build/changed_cpp_files.txt
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Map changed C++ files to build targets
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          build = (repo / "build").resolve()

          changed_files = []
          for line in (build / "changed_cpp_files.txt").read_text().splitlines():
            line = line.strip()
            if not line:
              continue
            src = (repo / line).resolve()
            if src.exists():
              changed_files.append(src)

          compile_db = json.loads((build / "compile_commands.json").read_text())
          output_by_file = {}
          for entry in compile_db:
            file_path = Path(entry["file"]).resolve()
            cmd = entry.get("command", "")
            match = re.search(r"(?:^|\\s)-o\\s+([^\\s]+)", cmd)
            if not match:
              continue
            out = Path(match.group(1))
            if not out.is_absolute():
              out = (Path(entry["directory"]) / out).resolve()
            output_by_file[file_path] = out

          targets = []
          missing = []
          for src in changed_files:
            out = output_by_file.get(src)
            if out is None:
              missing.append(str(src.relative_to(repo)))
              continue
            try:
              targets.append(str(out.relative_to(build)))
            except ValueError:
              missing.append(str(src.relative_to(repo)))

          targets = sorted(set(targets))
          (build / "changed_object_targets.txt").write_text("\n".join(targets) + ("\n" if targets else ""))

          if missing:
            print("::warning::No compile target mapping for changed files: " + ", ".join(missing))
          print(f"Mapped {len(targets)} changed C++ file(s) to object targets.")
          PY

      - name: Build changed C++ objects
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          mapfile -t object_targets < build/changed_object_targets.txt
          if [[ "${#object_targets[@]}" -eq 0 ]]; then
            echo "::error::Changed C++ files were detected, but no build targets were mapped."
            exit 1
          fi

          cmake --build build \
            --config RelWithDebInfo \
            --parallel 1 \
            --target "${object_targets[@]}"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Verify selective build artifacts
        shell: bash
        run: |
          if [[ ! -f build/compile_commands.json ]]; then
            echo "::error::Missing expected artifact: build/compile_commands.json"
            exit 1
          fi

          if [[ "${{ steps.cpp_changes.outputs.has_changes }}" != "true" ]]; then
            echo "No C++ source changes detected; selective build was skipped."
            exit 0
          fi

          while IFS= read -r target; do
            [[ -z "$target" ]] && continue
            if [[ ! -f "build/$target" ]]; then
              echo "::error::Missing expected object artifact: build/$target"
              exit 1
            fi
          done < build/changed_object_targets.txt

      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asset-asrl-cpp-build-ubuntu-22.04
          path: |
            build/compile_commands.json
            build/changed_cpp_files.txt
            build/changed_object_targets.txt
          if-no-files-found: error
          retention-days: 14
