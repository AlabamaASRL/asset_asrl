
name: ASSET Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            clang-13 \
            ninja-build \
            cmake

      - name: Install Ubuntu dependencies
        shell: bash
        run: |
          bash install_ubuntu_dependencies.sh

      - name: Configure CMake
        shell: bash
        run: |
          export CC=clang-13
          export CXX=clang++-13

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPIP_INSTALL=True \
            -DBUILD_SPHINX_DOCS=True

      - name: Build ASSET and wheel
        shell: bash
        run: |
          cmake --build build \
            --target asset pypiwheel \
            --parallel 2

  windows:
    name: Windows Build (Clang + Ninja)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"
          directory: "C:/Program Files/LLVM"
          cached: true

      - name: Install Ninja and Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja mkl-devel intel-openmp

      - name: Verify toolchain
        shell: pwsh
        run: |
          & "C:/Program Files/LLVM/bin/clang-cl.exe" --version
          & "C:/Program Files/LLVM/bin/lld-link.exe" --version
          cmake --version
          ninja --version
          python --version

      - name: Configure CMake
        shell: pwsh
        run: |
          $llvm = "C:/Program Files/LLVM/bin"

          cmake -S . -B build -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DPIP_INSTALL=True" `
            "-DBUILD_SPHINX_DOCS=True" `
            "-DCMAKE_C_COMPILER=$llvm/clang-cl.exe" `
            "-DCMAKE_CXX_COMPILER=$llvm/clang-cl.exe" `
            "-DCMAKE_LINKER=$llvm/lld-link.exe" `
            "-DCMAKE_C_COMPILER_RANLIB=$llvm/llvm-ranlib.exe" `
            "-DCMAKE_CXX_COMPILER_RANLIB=$llvm/llvm-ranlib.exe" `
            "-DCMAKE_C_COMPILER_AR=$llvm/llvm-ar.exe" `
            "-DCMAKE_CXX_COMPILER_AR=$llvm/llvm-ar.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE"
          }

      - name: Build ASSET and wheel
        shell: pwsh
        run: |
          cmake --build build `
            --target asset pypiwheel `
            --parallel 24

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE"
          }

      - name: List generated wheels
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Filter "*.whl" -Recurse |
            Select-Object -ExpandProperty FullName
