name: Build C++ development target

on:
  push:
    branches:
      - kurelowech_pines

  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit SHA to diff against for selective C++ builds
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: C++ build - Ubuntu 22.04
    runs-on: ubuntu-22.04

    env:
      BUILD_TYPE: RelWithDebInfo
      PYTHON_VERSION: "3.9"
      PYTHON_TARGET: asset

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: Print runner information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RUNNER INFORMATION"
          echo "============================================================"

          echo "Date:"
          date

          echo
          echo "Hostname:"
          hostname

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc
          lscpu | sed -n '1,40p'

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "============================================================"

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Print repository information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "REPOSITORY INFORMATION"
          echo "============================================================"

          echo "Repository:"
          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit information:"
          git log -1 --decorate --stat

          echo
          echo "Git status:"
          git status --short

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Print Python information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "PYTHON INFORMATION"
          echo "============================================================"

          python --version
          python -c "import sys; print('Python executable:', sys.executable)"
          python -c "import sys; print('Python prefix:', sys.prefix)"
          python -c "import sys; print('Python version:', sys.version)"

          echo
          echo "pip:"
          python -m pip --version

      # ============================================================
      # UBUNTU DEPENDENCIES
      # ============================================================

      - name: Install Ubuntu dependencies
        env:
          COMPILER: clang-13
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING UBUNTU DEPENDENCIES"
          echo "============================================================"

          bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      # ============================================================
      # COMPILER INFORMATION
      # ============================================================

      - name: Print compiler information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMPILER INFORMATION"
          echo "============================================================"

          echo "clang:"
          clang --version || true

          echo
          echo "clang++:"
          clang++ --version || true

          echo
          echo "gcc:"
          gcc --version | sed -n '1p' || true

          echo
          echo "g++:"
          g++ --version | sed -n '1p' || true

          echo
          echo "cmake:"
          cmake --version

          echo
          echo "ninja:"
          ninja --version || true

          echo
          echo "make:"
          make --version | sed -n '1p'

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-22.04-clang-13
          max-size: 2G

      - name: Print ccache information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CCACHE INFORMATION"
          echo "============================================================"

          ccache --version
          ccache --show-config || true
          ccache --show-stats || true

      # ============================================================
      # PYTHON BUILD REQUIREMENTS
      # ============================================================

      - name: Install Python build requirements
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING PYTHON REQUIREMENTS"
          echo "============================================================"

          python -m pip install --upgrade pip wheel setuptools

          python -m pip install -r requirements.txt

          echo
          echo "Installed packages:"
          python -m pip list

      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Clean CMake build directory
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CLEANING BUILD DIRECTORY"
          echo "============================================================"

          rm -rf build
          rm -rf dist

          mkdir -p build
          mkdir -p dist

          echo
          echo "Build directory:"
          ls -la build

          echo
          echo "Memory:"
          free -h

      # ============================================================
      # CMAKE CONFIGURATION
      # ============================================================

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CONFIGURING CMAKE"
          echo "============================================================"

          python_executable="$(
            python -c 'import sys; print(sys.executable)'
          )"

          echo "Python executable:"
          echo "$python_executable"

          echo
          echo "CMake command:"

          echo \
            cmake -S . \
              -B build \
              -G "Unix Makefiles" \
              -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DPIP_INSTALL=True \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DPython_EXECUTABLE="$python_executable"

          echo
          echo "Starting CMake configuration..."

          cmake -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPIP_INSTALL=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="$python_executable"

          echo
          echo "CMake configuration completed."

      # ============================================================
      # CMAKE CONFIGURATION LOGGING
      # ============================================================

      - name: Log CMake configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CMAKE CONFIGURATION"
          echo "============================================================"

          echo "CMake cache:"
          grep -E \
            '^(CMAKE_BUILD_TYPE|CMAKE_C_COMPILER|CMAKE_CXX_COMPILER|Python|PIP_INSTALL|CMAKE_GENERATOR)' \
            build/CMakeCache.txt \
            | sort \
            || true

          echo
          echo "CMake generator:"
          grep '^CMAKE_GENERATOR:' \
            build/CMakeCache.txt \
            || true

          echo
          echo "Build directory:"
          du -sh build || true

          echo
          echo "Build tree:"
          find build \
            -maxdepth 2 \
            -type f \
            -print \
            | sort \
            | sed -n '1,300p'

          echo
          echo "Memory:"
          free -h

      # ============================================================
      # DETECT CHANGED C/C++ FILES (INFORMATIONAL ONLY)
      #
      # The asset Python extension build is intentionally unconditional on this
      # branch/workflow trigger. This detection is only for reporting what changed
      # in the diff range (including new headers like src/Astro/PinesGravity.h).
      # ============================================================

      - name: Detect changed C/C++ files
        id: cpp_changes
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DETECTING CHANGED C/C++ FILES"
          echo "============================================================"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                -n "${{ inputs.base_sha }}" ]]; then

            echo "Using manually supplied base SHA:"
            echo "${{ inputs.base_sha }}"

            if ! git rev-parse --verify \
              "${{ inputs.base_sha }}^{commit}" \
              >/dev/null 2>&1; then

              echo "::error::Invalid base_sha:"
              echo "${{ inputs.base_sha }}"

              exit 1
            fi

            base_ref="${{ inputs.base_sha }}"

          else

            default_branch="${{ github.event.repository.default_branch }}"

            echo "Default branch:"
            echo "$default_branch"

            git fetch \
              --no-tags \
              origin \
              "$default_branch:refs/remotes/origin/$default_branch"

            base_ref="$(
              git merge-base \
                HEAD \
                "origin/$default_branch"
            )"

          fi

          echo
          echo "Base commit:"
          echo "$base_ref"

          echo
          echo "Current commit:"
          git rev-parse HEAD

          mapfile -t changed_files < <(
            git diff \
              --name-only \
              --diff-filter=ACMR \
              "$base_ref" \
              HEAD \
              -- \
              '*.c' \
              '*.cc' \
              '*.cpp' \
              '*.cxx' \
              '*.h' \
              '*.hh' \
              '*.hpp' \
              '*.hxx' \
            | sed '/^[[:space:]]*$/d'
          )

          echo
          echo "Number of changed C/C++ files:"
          echo "${#changed_files[@]}"

          : > build/changed_cxx_files.txt

          if [[ "${#changed_files[@]}" -eq 0 ]]; then

           echo "has_changes=true" \
             >> "$GITHUB_OUTPUT"
           echo "cpp_changes_detected=false" \
             >> "$GITHUB_OUTPUT"

           echo
           echo "No C/C++ changes detected in the selected diff range."
           echo "Continuing anyway: the asset extension build is intentionally unconditional."

          else

           echo
           echo "Changed C/C++ files:"
           printf '  %s\n' "${changed_files[@]}"

           printf '%s\n' "${changed_files[@]}" \
             > build/changed_cxx_files.txt

           echo "has_changes=true" \
             >> "$GITHUB_OUTPUT"
           echo "cpp_changes_detected=true" \
             >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # LOG CHANGE DETECTION
      # ============================================================

      - name: Log changed files
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CHANGED C/C++ FILES"
          echo "============================================================"

          if [[ "${{ steps.cpp_changes.outputs.cpp_changes_detected }}" == "true" ]]; then
            nl -ba build/changed_cxx_files.txt
            echo
            echo "File count:"
            wc -l build/changed_cxx_files.txt
          else
            echo "No C/C++ file diffs were detected."
            echo "Build continues intentionally to keep asset binaries up to date."
          fi

      # ============================================================
      # BUILD PCH
      #
      # This is intentionally done before the asset target.
      #
      # ASSET's C++ compile commands use the generated PCH.
      # Building the PCH separately avoids the earlier failure where
      # the compile command referenced a PCH that did not exist yet.
      # ============================================================

      - name: Build precompiled headers
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING PRECOMPILED HEADERS"
          echo "============================================================"

          echo "Memory before PCH:"
          free -h

          echo
          echo "Build command:"
          echo "cmake --build build --target pch --config ${BUILD_TYPE} --parallel 1"

          cmake --build build \
            --target pch \
            --config "${BUILD_TYPE}" \
            --parallel 1 \
            --verbose

          echo
          echo "PCH build completed."

          echo
          echo "PCH files:"
          find build \
            -type f \
            \( \
              -name "*.pch" \
              -o -name "cmake_pch.hxx" \
              -o -name "cmake_pch.cxx" \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Memory after PCH:"
          free -h

      # ============================================================
      # LOG COMPILE DATABASE
      # ============================================================

      - name: Inspect compile database
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMPILE DATABASE"
          echo "============================================================"

          if [[ ! -f build/compile_commands.json ]]; then

            echo "::error::compile_commands.json does not exist."

            exit 1
          fi

          echo "Compile database:"
          ls -lh build/compile_commands.json

          echo
          echo "Number of compile commands:"

          python - <<'PY'
          import json

          with open("build/compile_commands.json") as f:
              commands = json.load(f)

          print(len(commands))
          PY

          echo
          echo "PCH references:"
          grep -o \
            'cmake_pch[^" ]*' \
            build/compile_commands.json \
            | sort \
            | uniq \
            | sed -n '1,50p' \
            || true

      # ============================================================
      # LIST CMAKE TARGETS
      # ============================================================

      - name: List CMake targets
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CMAKE TARGETS"
          echo "============================================================"

          cmake --build build \
            --target help \
            > build/cmake_targets.txt

          cat build/cmake_targets.txt

          echo
          echo "Python target selected by workflow:"
          echo "  ${PYTHON_TARGET}"

          echo
          echo "Checking that the Python target exists:"

          if grep -Eq \
            "^\\.\\.\\. ${PYTHON_TARGET}([[:space:]]|$)" \
            build/cmake_targets.txt; then

            echo "PASS: ${PYTHON_TARGET} target exists."

          else

            echo "::error::Python target '${PYTHON_TARGET}' was not found."

            echo
            echo "Available targets:"
            cat build/cmake_targets.txt

            exit 1
          fi

          echo
          echo "Important ASSET targets:"

          grep -E \
            '^\\.\\.\\. (asset|asset_extensions|astro|pch|psiopt|optimalcontrol|utils|vectorfunctions)' \
            build/cmake_targets.txt \
            || true

      # ============================================================
      # VERIFY CMAKE TARGET RELATIONSHIPS
      #
      # asset is the actual pybind11 Python module.
      # asset_extensions is only a static library dependency.
      # ============================================================

      - name: Verify Python target configuration
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING PYTHON TARGET CONFIGURATION"
          echo "============================================================"

          echo "Python target:"
          echo "  ${PYTHON_TARGET}"

          echo
          echo "Expected Python module:"
          echo "  asset"

          echo
          echo "Expected static extension library:"
          echo "  asset_extensions"

          echo
          echo "Checking src/CMakeLists.txt:"

          if grep -n \
            'pybind11_add_module(asset main.cpp)' \
            src/CMakeLists.txt; then

            echo
            echo "PASS: asset is the pybind11 module target."

          else

            echo
            echo "::error::Expected pybind11 asset target was not found."

            grep -n \
              'pybind11_add_module' \
              src/CMakeLists.txt \
              || true

            exit 1
          fi

          echo
          echo "Checking extensions/CMakeLists.txt:"

          if grep -n \
            'add_library(asset_extensions STATIC' \
            extensions/CMakeLists.txt; then

            echo
            echo "PASS: asset_extensions is a static library."

          else

            echo
            echo "WARNING: Could not verify asset_extensions declaration."

          fi

      # ============================================================
      # BUILD PYTHON EXTENSION
      #
      # IMPORTANT:
      #
      # The actual Python extension target is "asset".
      #
      # Do NOT build asset_extensions as the final target. That target
      # produces libasset_extensions.a, not the Python .so.
      #
      # CMake will automatically build only the dependencies required
      # by asset. Unrelated development targets are not requested.
      #
      # This step is intentionally unconditional after configure, even when
      # the C/C++ diff list is empty, so newly introduced headers such as
      # src/Astro/PinesGravity.h are still compiled into the asset module.
      #
      # --parallel 1 keeps memory usage bounded.
      # ============================================================

      - name: Build Python extension
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING PYTHON EXTENSION"
          echo "============================================================"

          echo "Selected target:"
          echo "  ${PYTHON_TARGET}"

          echo
          echo "Memory before build:"
          free -h

          echo
          echo "Disk before build:"
          df -h .

          echo
          echo "Build command:"
          echo "cmake --build build --target ${PYTHON_TARGET} --config ${BUILD_TYPE} --parallel 1 --verbose"

          echo
          echo "Starting build..."

          cmake --build build \
            --target "${PYTHON_TARGET}" \
            --config "${BUILD_TYPE}" \
            --parallel 1 \
            --verbose

          echo
          echo "Python extension target completed."

          echo
          echo "Memory after build:"
          free -h

          echo
          echo "Disk after build:"
          df -h .
