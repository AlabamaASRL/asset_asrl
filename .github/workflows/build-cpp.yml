name: Build C++ development target

on:
  push:
    branches:
      - kurelowech_pines

  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit SHA to diff against for selective C++ builds
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: C++ build - Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Ubuntu dependencies
        env:
          COMPILER: clang-13
        run: bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-22.04-clang-13
          max-size: 2G

      - name: Install Python build requirements
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      - name: Configure CMake
        run: |
          cmake -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPIP_INSTALL=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      - name: Detect changed C/C++ files
        id: cpp_changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                -n "${{ inputs.base_sha }}" ]]; then

            if ! git rev-parse --verify "${{ inputs.base_sha }}^{commit}" >/dev/null 2>&1; then
              echo "::error::Invalid base_sha: ${{ inputs.base_sha }}"
              exit 1
            fi

            base_ref="${{ inputs.base_sha }}"

          else
            default_branch="${{ github.event.repository.default_branch }}"

            git fetch --no-tags origin \
              "$default_branch:refs/remotes/origin/$default_branch"

            if ! git rev-parse --verify "origin/$default_branch" >/dev/null 2>&1; then
              echo "::error::Unable to find origin/$default_branch"
              exit 1
            fi

            base_ref="$(git merge-base HEAD "origin/$default_branch")"
          fi

          echo "Current commit: ${{ github.sha }}"
          echo "Base commit:    $base_ref"

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR \
              "$base_ref" "${{ github.sha }}" \
              -- '*.c' '*.cc' '*.cpp' '*.cxx' \
                 '*.h' '*.hh' '*.hpp' '*.hxx' \
            | sed '/^[[:space:]]*$/d'
          )

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No C/C++ source or header changes detected."
            exit 0
          fi

          echo "Changed C/C++ files:"
          printf '%s\n' "${changed_files[@]}"

          printf '%s\n' "${changed_files[@]}" \
            > build/changed_cxx_files.txt

          cp build/changed_cxx_files.txt \
            build/changed_cpp_files.txt

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Compile changed C/C++ source files and headers
        id: compile_changed
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import shlex
          import subprocess
          import tempfile
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          build = (repo / "build").resolve()

          source_suffixes = {
              ".c",
              ".cc",
              ".cpp",
              ".cxx",
          }

          header_suffixes = {
              ".h",
              ".hh",
              ".hpp",
              ".hxx",
          }

          changed_files = []

          for line in (
              build / "changed_cxx_files.txt"
          ).read_text().splitlines():

              line = line.strip()

              if not line:
                  continue

              src = (repo / line).resolve()

              if src.exists():
                  changed_files.append(src)

          compile_db = json.loads(
              (build / "compile_commands.json").read_text()
          )

          def resolve_entry_path(entry):
              file_path = Path(entry["file"])

              if not file_path.is_absolute():
                  file_path = (
                      Path(entry["directory"])
                      / file_path
                  ).resolve()
              else:
                  file_path = file_path.resolve()

              return file_path

          entry_by_file = {}

          for entry in compile_db:
              entry_by_file[
                  resolve_entry_path(entry)
              ] = entry

          source_files = []
          header_files = []

          for path in changed_files:

              if path.suffix.lower() in source_suffixes:
                  source_files.append(path)

              elif path.suffix.lower() in header_suffixes:
                  header_files.append(path)

          def command_from_entry(entry):

              if isinstance(
                  entry.get("arguments"),
                  list,
              ):
                  return list(entry["arguments"])

              if entry.get("command"):
                  return shlex.split(
                      entry["command"]
                  )

              print(
                  "::error::Compile database entry is "
                  "missing both 'arguments' and 'command' "
                  f"for {entry.get('file', '<unknown>')}"
              )

              raise SystemExit(1)

          def resolve_path(path_str, base_dir):
              path = Path(path_str)

              if not path.is_absolute():
                  return (
                      base_dir / path
                  ).resolve()

              return path.resolve()

          def infer_target_name(path):

              parts = path.parts

              for idx, part in enumerate(parts):

                  if part == "CMakeFiles" and idx + 1 < len(parts):

                      target_dir = parts[idx + 1]

                      if target_dir.endswith(".dir"):
                          return target_dir[:-4]

              return None

          prepared_targets = set()

          def ensure_pch_prereqs(
              cmd,
              workdir,
          ):
              pch_paths = []

              for idx, arg in enumerate(cmd):

                  if arg == "-include-pch" and idx + 1 < len(cmd):
                      pch_paths.append(
                          resolve_path(
                              cmd[idx + 1],
                              workdir,
                          )
                      )

                  elif arg.startswith("-include-pch="):
                      pch_paths.append(
                          resolve_path(
                              arg.split("=", 1)[1],
                              workdir,
                          )
                      )

                  elif arg.endswith(".pch"):
                      pch_paths.append(
                          resolve_path(
                              arg,
                              workdir,
                          )
                      )

              for pch_path in pch_paths:

                  if pch_path.exists():
                      continue

                  target_name = infer_target_name(
                      pch_path
                  )

                  if target_name is None:
                      print(
                          "::error::Unable to infer target "
                          "for missing precompiled header: "
                          f"{pch_path}"
                      )
                      raise SystemExit(1)

                  if target_name in prepared_targets:
                      continue

                  print(
                      "Building prerequisite target:",
                      target_name,
                  )

                  result = subprocess.run(
                      [
                          "cmake",
                          "--build",
                          str(build),
                          "--target",
                          target_name,
                          "--parallel",
                          "1",
                      ],
                      cwd=repo,
                  )

                  if result.returncode != 0:
                      raise SystemExit(
                          result.returncode
                      )

                  prepared_targets.add(
                      target_name
                  )

          def remove_output_flags(cmd):

              result = []
              idx = 0

              while idx < len(cmd):

                  arg = cmd[idx]

                  if arg in ("-o", "-MF"):

                      idx += 2
                      continue

                  result.append(arg)
                  idx += 1

              return result

          def replace_source(
              cmd,
              original,
              replacement,
          ):

              original = original.resolve()

              for idx, arg in enumerate(cmd):

                  if arg.startswith("-"):
                      continue

                  candidate = Path(arg)

                  if not candidate.is_absolute():
                      candidate = (
                          Path.cwd()
                          / candidate
                      )

                  try:
                      candidate = candidate.resolve()
                  except OSError:
                      continue

                  if candidate == original:
                      cmd[idx] = str(
                          replacement
                      )
                      return

              cmd.append(
                  str(replacement)
              )

          def choose_header_command(
              header_path,
          ):

              candidates = []

              for entry in compile_db:

                  source_path = resolve_entry_path(
                      entry
                  )

                  if (
                      source_path.suffix.lower()
                      not in source_suffixes
                  ):
                      continue

                  try:
                      relative = (
                          header_path.relative_to(
                              source_path.parent
                          )
                      )

                      distance = len(
                          relative.parts
                      )

                  except ValueError:
                      distance = 9999

                  same_dir = (
                      header_path.parent
                      == source_path.parent
                  )

                  score = (
                      0 if same_dir else 1,
                      distance,
                      str(source_path),
                  )

                  candidates.append(
                      (score, entry)
                  )

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda item: item[0]
              )

              return candidates[0][1]

          # ---------------------------------------------------------
          # Compile changed source files normally
          # ---------------------------------------------------------

          missing_sources = []

          for source in source_files:

              if source not in entry_by_file:
                  missing_sources.append(
                      str(source.relative_to(repo))
                  )

          if missing_sources:

              print(
                  "::error::No compile target mapping "
                  "for changed source files: "
                  + ", ".join(missing_sources)
              )

              raise SystemExit(1)

          for source in source_files:

              entry = entry_by_file[source]

              cmd = command_from_entry(entry)

              workdir = Path(
                  entry["directory"]
              ).resolve()

              source_path = resolve_entry_path(
                  entry
              )

              ensure_pch_prereqs(
                  cmd,
                  workdir,
              )

              # Make sure the command uses the
              # absolute source path.
              for idx, arg in enumerate(cmd):

                  if arg.startswith("-"):
                      continue

                  try:
                      candidate = Path(arg)

                      if not candidate.is_absolute():
                          candidate = (
                              workdir / candidate
                          ).resolve()
                      else:
                          candidate = candidate.resolve()

                      if candidate == source_path:
                          cmd[idx] = str(
                              source_path
                          )

                  except (OSError, ValueError):
                      pass

              print(
                  "Compiling source:",
                  source.relative_to(repo),
              )

              result = subprocess.run(
                  cmd,
                  cwd=workdir,
              )

              if result.returncode != 0:
                  raise SystemExit(
                      result.returncode
                  )

          # ---------------------------------------------------------
          # Explicitly compile changed headers
          # ---------------------------------------------------------

          for header in header_files:

              entry = choose_header_command(
                  header
              )

              if entry is None:

                  print(
                      "::error::No suitable C++ compile "
                      "command found for header: "
                      f"{header.relative_to(repo)}"
                  )

                  raise SystemExit(1)

              cmd = command_from_entry(
                  entry
              )

              workdir = Path(
                  entry["directory"]
              ).resolve()

              source_path = resolve_entry_path(
                  entry
              )

              ensure_pch_prereqs(
                  cmd,
                  workdir,
              )

              # Create a temporary translation unit
              # that includes the changed header.
              with tempfile.NamedTemporaryFile(
                  mode="w",
                  suffix=".cpp",
                  dir=str(header.parent),
                  delete=False,
                  encoding="utf-8",
              ) as tmp:

                  tmp.write(
                      f'#include "{header.name}"\n'
                  )

                  wrapper = Path(
                      tmp.name
                  ).resolve()

              try:

                  header_cmd = list(cmd)

                  # Remove the normal object/dependency
                  # output arguments.
                  header_cmd = remove_output_flags(
                      header_cmd
                  )

                  # Replace the source file from the
                  # compile database with our temporary
                  # translation unit.
                  replace_source(
                      header_cmd,
                      source_path,
                      wrapper,
                  )

                  # Explicitly compile the header.
                  #
                  # -fsyntax-only checks that the header
                  # can be compiled without producing an
                  # object file.
                  #
                  # -x c++ ensures the temporary file is
                  # treated as C++.
                  if "-fsyntax-only" not in header_cmd:
                      header_cmd.append(
                          "-fsyntax-only"
                      )

                  print(
                      "Compiling header:",
                      header.relative_to(repo),
                  )

                  result = subprocess.run(
                      header_cmd,
                      cwd=workdir,
                  )

                  if result.returncode != 0:
                      raise SystemExit(
                          result.returncode
                      )

              finally:

                  try:
                      wrapper.unlink()
                  except FileNotFoundError:
                      pass

          print(
              f"Compiled {len(source_files)} "
              "changed source file(s)."
          )

          print(
              f"Compiled {len(header_files)} "
              "changed header file(s)."
          )
          PY

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Verify selective build artifacts
        shell: bash
        run: |
          if [[ ! -f build/compile_commands.json ]]; then
            echo "::error::Missing expected artifact: build/compile_commands.json"
            exit 1
          fi

          if [[ "${{ steps.cpp_changes.outputs.has_changes }}" != "true" ]]; then
            echo "No C/C++ source changes detected; selective build was skipped."
            exit 0
          fi

          if [[ ! -f build/changed_cxx_files.txt ]]; then
            echo "::error::Missing expected changed file list: build/changed_cxx_files.txt"
            exit 1
          fi

      - name: Find compiled binaries
        if: steps.cpp_changes.outputs.has_changes == 'true'
        id: binaries
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t binaries < <(
            find . \
              -type f \
              \( \
                -name "*.so" \
                -o -name "*.so.*" \
                -o -name "*.a" \
              \) \
              -not -path "./.git/*" \
              -not -path "./build/CMakeFiles/*" \
              | sort
          )

          if [[ "${#binaries[@]}" -eq 0 ]]; then
            echo "No compiled binaries found."
            echo "has_binaries=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Compiled binaries:"
          printf '%s\n' "${binaries[@]}"

          printf '%s\n' "${binaries[@]}" \
            > build/compiled_binaries.txt

          echo "has_binaries=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated C++ binaries
        if: steps.binaries.outputs.has_binaries == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t binaries < build/compiled_binaries.txt

          echo "Adding binaries to Git:"
          printf '  %s\n' "${binaries[@]}"

          git add -- "${binaries[@]}"

          if git diff --cached --quiet; then
            echo "No binary changes detected."
            exit 0
          fi

          git commit -m "Update C++ binaries [automated]"

          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload development artifacts
        if: steps.cpp_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asset-asrl-cpp-build-ubuntu-22.04
          path: |
            build/compile_commands.json
            build/changed_cxx_files.txt
            build/changed_cpp_files.txt
            build/compiled_binaries.txt
          if-no-files-found: error
          retention-days: 14
