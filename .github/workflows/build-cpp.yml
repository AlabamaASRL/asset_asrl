name: Build C++ development target

on:
  push:
    branches:
      - kurelowech_pines

  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit SHA to diff against for selective C++ builds
        required: false
        type: string

permissions:
  contents: write

env:
  BUILD_TYPE: RelWithDebInfo
  PYTHON_VERSION: "3.9"
  PYTHON_TARGET: asset
  CC: clang-13
  CXX: clang++-13

jobs:
  build:
    name: C++ build - Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # System information
      # ------------------------------------------------------------
      - name: Print system information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "System information"
          echo "============================================================"

          uname -a
          lscpu | sed -n '1,40p'
          free -h
          df -h .

      # ------------------------------------------------------------
      # Detect changed C/C++ files BEFORE configuring CMake
      # ------------------------------------------------------------
      - name: Detect changed C/C++ files
        id: cpp_changes
        shell: bash
        env:
          BASE_SHA_INPUT: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Detecting changed C/C++ files"
          echo "============================================================"

          if [[ -n "${BASE_SHA_INPUT:-}" ]]; then
            BASE_SHA="${BASE_SHA_INPUT}"
            echo "Using manually supplied base SHA: ${BASE_SHA}"
          else
            BASE_SHA="${{ github.event.before }}"

            if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi

            echo "Using push base SHA: ${BASE_SHA}"
          fi

          if [[ -z "${BASE_SHA}" ]]; then
            echo "Could not determine a base SHA."
            exit 1
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base SHA ${BASE_SHA} is not available."
            echo "Fetching additional history..."
            git fetch --no-tags --prune --unshallow || true
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "ERROR: Base SHA ${BASE_SHA} still cannot be found."
            exit 1
          fi

          git diff \
            --name-only \
            --diff-filter=ACMR \
            "${BASE_SHA}" "${GITHUB_SHA}" \
            -- \
            '*.c' \
            '*.cc' \
            '*.cpp' \
            '*.cxx' \
            '*.h' \
            '*.hh' \
            '*.hpp' \
            '*.hxx' \
            > changed_cxx_files.txt

          echo
          echo "Changed C/C++ files:"
          if [[ -s changed_cxx_files.txt ]]; then
            cat changed_cxx_files.txt
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "None"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        if: steps.cpp_changes.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ubuntu dependencies
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang-13 \
            clang++-13 \
            ccache \
            ninja-build \
            pkg-config \
            libomp-13-dev

      # ------------------------------------------------------------
      # Compiler information
      #
      # Do NOT use:
      #   make --version | head -1
      #
      # with pipefail because make can receive SIGPIPE when head exits.
      # ------------------------------------------------------------
      - name: Print compiler information
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Compiler information"
          echo "============================================================"

          echo
          echo "clang-13:"
          clang-13 --version

          echo
          echo "clang++-13:"
          clang++-13 --version

          echo
          echo "gcc:"
          gcc --version | sed -n '1p'

          echo
          echo "g++:"
          g++ --version | sed -n '1p'

          echo
          echo "make:"
          make --version | sed -n '1p'

          echo
          echo "cmake:"
          cmake --version | sed -n '1p'

          echo
          echo "python:"
          python --version

          echo
          echo "ccache:"
          ccache --version | sed -n '1p'

      # ------------------------------------------------------------
      # ccache
      # ------------------------------------------------------------
      - name: Set up ccache
        if: steps.cpp_changes.outputs.has_changes == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu-22.04-clang13-asset

      # ------------------------------------------------------------
      # Python build dependencies
      # ------------------------------------------------------------
      - name: Install Python build dependencies
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            pybind11 \
            setuptools \
            wheel

      # ------------------------------------------------------------
      # Clean build directory
      # ------------------------------------------------------------
      - name: Clean build directory
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          rm -rf dist

          mkdir -p build
          mkdir -p dist

      # ------------------------------------------------------------
      # Configure CMake
      # ------------------------------------------------------------
      - name: Configure CMake
        id: configure
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        env:
          Python_EXECUTABLE: ${{ env.pythonLocation }}/bin/python
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Configuring CMake"
          echo "============================================================"

          cmake \
            -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_C_COMPILER=clang-13 \
            -DCMAKE_CXX_COMPILER=clang++-13 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPIP_INSTALL=True \
            -DPython_EXECUTABLE="${Python_EXECUTABLE}"

      # ------------------------------------------------------------
      # CMake configuration diagnostics
      # ------------------------------------------------------------
      - name: Print CMake configuration
        if: steps.configure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CMake configuration"
          echo "============================================================"

          cmake -LA -N build

          echo
          echo "Compile commands:"
          if [[ -f build/compile_commands.json ]]; then
            python - <<'PY'
          import json

          with open("build/compile_commands.json", encoding="utf-8") as f:
              commands = json.load(f)

          print(f"Number of compile commands: {len(commands)}")

          for entry in commands[:10]:
              print()
              print(entry["file"])
              print(entry["command"])
          PY
          else
            echo "compile_commands.json does not exist."
          fi

      # ------------------------------------------------------------
      # Build PCH first
      # ------------------------------------------------------------
      - name: Build PCH
        if: steps.configure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Building PCH"
          echo "============================================================"

          cmake \
            --build build \
            --target pch \
            --config "${BUILD_TYPE}" \
            --parallel 1 \
            --verbose

      # ------------------------------------------------------------
      # Validate changed C/C++ source files
      # ------------------------------------------------------------
      - name: Validate changed C/C++ files
        if: steps.configure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Validating changed C/C++ files"
          echo "============================================================"

          if [[ ! -s changed_cxx_files.txt ]]; then
            echo "No changed C/C++ files."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import shlex
          import subprocess
          import tempfile
          from pathlib import Path

          changed = [
              Path(line.strip())
              for line in Path("changed_cxx_files.txt").read_text().splitlines()
              if line.strip()
          ]

          compile_db_path = Path("build/compile_commands.json")

          if not compile_db_path.exists():
              raise RuntimeError("build/compile_commands.json does not exist")

          compile_db = json.loads(compile_db_path.read_text())

          entries = {}
          for entry in compile_db:
              source = Path(entry["file"]).resolve()
              entries[str(source)] = entry

          source_extensions = {
              ".c",
              ".cc",
              ".cpp",
              ".cxx",
          }

          header_extensions = {
              ".h",
              ".hh",
              ".hpp",
              ".hxx",
          }

          def get_command(entry):
              if "arguments" in entry:
                  return list(entry["arguments"])

              return shlex.split(entry["command"])

          def clean_compile_command(command):
              cleaned = []
              i = 0

              while i < len(command):
                  arg = command[i]

                  if arg in {"-o", "-MF", "-MT"}:
                      i += 2
                      continue

                  if arg in {
                      "-c",
                      "-MD",
                      "-MMD",
                      "-MP",
                  }:
                      i += 1
                      continue

                  cleaned.append(arg)
                  i += 1

              return cleaned

          for path in changed:
              path = path.resolve()

              if not path.exists():
                  print(f"Skipping deleted file: {path}")
                  continue

              suffix = path.suffix.lower()

              print()
              print("=" * 70)
              print(f"Validating: {path}")
              print("=" * 70)

              if suffix in source_extensions:
                  entry = entries.get(str(path))

                  if entry is None:
                      raise RuntimeError(
                          f"No compile_commands.json entry found for {path}"
                      )

                  command = clean_compile_command(get_command(entry))

                  command.append("-fsyntax-only")
                  command.append(str(path))

                  print("Running syntax validation:")
                  print(" ".join(shlex.quote(x) for x in command))

                  subprocess.run(command, check=True)

              elif suffix in header_extensions:
                  matching_entry = None

                  for source, entry in entries.items():
                      source_path = Path(source)

                      if source_path.parent == path.parent:
                          matching_entry = entry
                          break

                  if matching_entry is None:
                      raise RuntimeError(
                          f"No source compile command found in {path.parent} "
                          f"for header {path}"
                      )

                  command = clean_compile_command(
                      get_command(matching_entry)
                  )

                  with tempfile.TemporaryDirectory() as temp_dir:
                      wrapper = Path(temp_dir) / "header_validation.cpp"

                      wrapper.write_text(
                          f'#include "{path.as_posix()}"\n',
                          encoding="utf-8",
                      )

                      command.append("-fsyntax-only")
                      command.append(str(wrapper))

                      print("Running header validation:")
                      print(" ".join(shlex.quote(x) for x in command))

                      subprocess.run(command, check=True)

              else:
                  print(f"Skipping unsupported file type: {path}")

          print()
          print("All changed C/C++ files passed validation.")
          PY

      # ------------------------------------------------------------
      # Show available CMake targets
      # ------------------------------------------------------------
      - name: Verify Python extension target
        if: steps.configure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CMake targets"
          echo "============================================================"

          cmake --build build --target help | tee build/cmake_targets.txt

          echo
          echo "Checking for Python extension target: ${PYTHON_TARGET}"

          if grep -Eq "\.\.\. ${PYTHON_TARGET}([[:space:]]|$)" build/cmake_targets.txt; then
            echo "Found target: ${PYTHON_TARGET}"
          else
            echo
            echo "ERROR: Python extension target '${PYTHON_TARGET}' was not found."
            exit 1
          fi

      # ------------------------------------------------------------
      # Build the actual Python extension.
      #
      # The pybind11 module in src/main.cpp is:
      #
      #   PYBIND11_MODULE(asset, m)
      #
      # Therefore the correct target is "asset", NOT
      # "asset_extensions".
      # ------------------------------------------------------------
      - name: Build Python extension
        id: python_build
        if: steps.configure.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Building Python extension: ${PYTHON_TARGET}"
          echo "============================================================"

          cmake \
            --build build \
            --target "${PYTHON_TARGET}" \
            --config "${BUILD_TYPE}" \
            --parallel 1 \
            --verbose

      # ------------------------------------------------------------
      # Inspect build output
      # ------------------------------------------------------------
      - name: Inspect build output
        if: steps.python_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Build output"
          echo "============================================================"

          find build/src \
            -maxdepth 1 \
            -type f \
            \( \
              -name 'asset*.so' \
              -o -name 'asset*.pyd' \
              -o -name 'libasset*.a' \
            \) \
            -print \
            2>/dev/null || true

      # ------------------------------------------------------------
      # Collect only the actual Python extension
      # ------------------------------------------------------------
      - name: Prepare Python extension
        id: binaries
        if: steps.python_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Preparing Python extension"
          echo "============================================================"

          mkdir -p dist

          mapfile -t binaries < <(
            find build/src \
              -maxdepth 1 \
              -type f \
              \( \
                -name 'asset*.so' \
                -o -name 'asset*.pyd' \
              \) \
              -print
          )

          if [[ "${#binaries[@]}" -eq 0 ]]; then
            echo "ERROR: No asset Python extension was found."
            echo
            echo "Files under build:"
            find build -type f | sort | sed -n '1,200p'
            exit 1
          fi

          if [[ "${#binaries[@]}" -gt 1 ]]; then
            echo "Found multiple asset extension files:"
            printf '%s\n' "${binaries[@]}"
          fi

          for binary in "${binaries[@]}"; do
            echo "Copying: ${binary}"
            cp "${binary}" dist/
          done

          echo
          echo "dist contents:"
          ls -lah dist

          echo "has_binaries=true" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Check dynamic library dependencies
      # ------------------------------------------------------------
      - name: Check extension dependencies
        if: steps.binaries.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking extension dependencies"
          echo "============================================================"

          for binary in dist/asset*.so dist/asset*.pyd; do
            if [[ -f "${binary}" ]]; then
              echo
              echo "------------------------------------------------------------"
              echo "${binary}"
              echo "------------------------------------------------------------"

              if command -v ldd >/dev/null 2>&1; then
                ldd "${binary}" || true
              fi
            fi
          done

      # ------------------------------------------------------------
      # Import test
      # ------------------------------------------------------------
      - name: Test Python extension import
        id: import_test
        if: steps.binaries.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Testing Python extension import"
          echo "============================================================"

          export PYTHONPATH="${GITHUB_WORKSPACE}/dist${PYTHONPATH:+:${PYTHONPATH}}"

          python - <<'PY'
          import asset

          print("Successfully imported asset")
          print(f"asset.__file__ = {asset.__file__}")
          PY

      # ------------------------------------------------------------
      # Final artifact verification
      # ------------------------------------------------------------
      - name: Verify final artifact
        if: >
          steps.cpp_changes.outputs.has_changes == 'true' &&
          steps.configure.outcome == 'success' &&
          steps.python_build.outcome == 'success' &&
          steps.binaries.outcome == 'success' &&
          steps.import_test.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Final artifact verification"
          echo "============================================================"

          test -f build/compile_commands.json
          test -d dist

          shopt -s nullglob

          binaries=(dist/asset*.so dist/asset*.pyd)

          if [[ "${#binaries[@]}" -eq 0 ]]; then
            echo "ERROR: No Python extension found in dist."
            exit 1
          fi

          for binary in "${binaries[@]}"; do
            echo
            echo "Artifact:"
            ls -lh "${binary}"
            file "${binary}"
          done

      # ------------------------------------------------------------
      # ccache statistics
      # ------------------------------------------------------------
      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "ccache statistics"
          echo "============================================================"

          ccache --show-stats || true

      # ------------------------------------------------------------
      # Resource diagnostics
      # ------------------------------------------------------------
      - name: Show final resource usage
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "Final resource usage"
          echo "============================================================"

          free -h
          df -h .

      # ------------------------------------------------------------
      # Failure diagnostics
      # ------------------------------------------------------------
      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "FAILURE DIAGNOSTICS"
          echo "============================================================"

          echo
          echo "Git status:"
          git status --short

          echo
          echo "Changed C/C++ files:"
          if [[ -f changed_cxx_files.txt ]]; then
            cat changed_cxx_files.txt
          else
            echo "changed_cxx_files.txt does not exist."
          fi

          echo
          echo "Build directory:"
          if [[ -d build ]]; then
            find build -maxdepth 3 -type f | sort | sed -n '1,300p'
          else
            echo "build directory does not exist."
          fi

          echo
          echo "dist directory:"
          if [[ -d dist ]]; then
            find dist -maxdepth 2 -type f -print
          else
            echo "dist directory does not exist."
          fi

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h .

      # ------------------------------------------------------------
      # Commit the built Python extension
      # ------------------------------------------------------------
      - name: Commit Python extension
        if: >
          success() &&
          steps.cpp_changes.outputs.has_changes == 'true' &&
          steps.import_test.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Committing Python extension"
          echo "============================================================"

          shopt -s nullglob

          binaries=(dist/asset*.so dist/asset*.pyd)

          if [[ "${#binaries[@]}" -eq 0 ]]; then
            echo "ERROR: No Python extension found to commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist/asset*.so dist/asset*.pyd

          if git diff --cached --quiet; then
            echo "No binary changes to commit."
            exit 0
          fi

          git status --short

          git commit \
            -m "Build C++ Python extension [skip ci]"

          git push origin "HEAD:${GITHUB_REF_NAME}"
