name: Build C++ Python extensions

on:
  push:
    branches:
      - kurelowech_pines

  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit SHA to diff against for selective C++ builds
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: C++ Python extensions - Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ------------------------------------------------------------
      # Ubuntu dependencies
      # ------------------------------------------------------------

      - name: Install Ubuntu dependencies
        env:
          COMPILER: clang-13
        run: bash "$GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh"

      # ------------------------------------------------------------
      # Compiler cache
      # ------------------------------------------------------------

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-22.04-clang-13
          max-size: 2G

      # ------------------------------------------------------------
      # Python build dependencies
      # ------------------------------------------------------------

      - name: Install Python build requirements
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      # ------------------------------------------------------------
      # Clean CMake directory
      # ------------------------------------------------------------

      - name: Clean CMake build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

      # ------------------------------------------------------------
      # Configure CMake
      #
      # IMPORTANT:
      # This only CONFIGURES the project.
      #
      # It does NOT build all ASSET development libraries.
      # ------------------------------------------------------------

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPIP_INSTALL=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      # ------------------------------------------------------------
      # Detect changed C/C++ files
      # ------------------------------------------------------------

      - name: Detect changed C/C++ files
        id: cpp_changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                -n "${{ inputs.base_sha }}" ]]; then

            if ! git rev-parse --verify \
              "${{ inputs.base_sha }}^{commit}" >/dev/null 2>&1; then

              echo "::error::Invalid base_sha: ${{ inputs.base_sha }}"
              exit 1
            fi

            base_ref="${{ inputs.base_sha }}"

          else

            default_branch="${{ github.event.repository.default_branch }}"

            git fetch --no-tags origin \
              "$default_branch:refs/remotes/origin/$default_branch"

            if ! git rev-parse --verify \
              "origin/$default_branch" >/dev/null 2>&1; then

              echo "::error::Unable to find origin/$default_branch"
              exit 1
            fi

            base_ref="$(git merge-base HEAD "origin/$default_branch")"

          fi

          echo "Current commit: ${{ github.sha }}"
          echo "Base commit:    $base_ref"

          mapfile -t changed_files < <(
            git diff \
              --name-only \
              --diff-filter=ACMR \
              "$base_ref" \
              "${{ github.sha }}" \
              -- \
              '*.c' \
              '*.cc' \
              '*.cpp' \
              '*.cxx' \
              '*.h' \
              '*.hh' \
              '*.hpp' \
              '*.hxx' \
            | sed '/^[[:space:]]*$/d'
          )

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No C/C++ source or header changes detected."
            exit 0
          fi

          echo "Changed C/C++ files:"
          printf '%s\n' "${changed_files[@]}"

          printf '%s\n' "${changed_files[@]}" \
            > build/changed_cxx_files.txt

          cp \
            build/changed_cxx_files.txt \
            build/changed_cpp_files.txt

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Compile changed files and validate headers
      #
      # This does NOT build the full ASSET development libraries.
      # ------------------------------------------------------------

      - name: Compile changed C/C++ files and validate headers
        id: compile_changed
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import shlex
          import subprocess
          import tempfile
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          build = (repo / "build").resolve()

          source_suffixes = {
              ".c",
              ".cc",
              ".cpp",
              ".cxx",
          }

          header_suffixes = {
              ".h",
              ".hh",
              ".hpp",
              ".hxx",
          }

          changed_files = []

          changed_file_list = build / "changed_cxx_files.txt"

          for line in changed_file_list.read_text().splitlines():

              line = line.strip()

              if not line:
                  continue

              path = (repo / line).resolve()

              if path.exists():
                  changed_files.append(path)

          # --------------------------------------------------------
          # Compile database
          # --------------------------------------------------------

          compile_db_path = build / "compile_commands.json"

          if not compile_db_path.exists():
              print(
                  "::error::Missing compile database: "
                  f"{compile_db_path}"
              )
              raise SystemExit(1)

          compile_db = json.loads(
              compile_db_path.read_text()
          )

          def resolve_entry_path(entry):

              file_path = Path(entry["file"])

              if not file_path.is_absolute():

                  file_path = (
                      Path(entry["directory"]) /
                      file_path
                  ).resolve()

              else:

                  file_path = file_path.resolve()

              return file_path

          entry_by_file = {}

          for entry in compile_db:

              entry_by_file[
                  resolve_entry_path(entry)
              ] = entry

          # --------------------------------------------------------
          # Separate source/header files
          # --------------------------------------------------------

          source_files = []
          header_files = []

          for path in changed_files:

              suffix = path.suffix.lower()

              if suffix in source_suffixes:
                  source_files.append(path)

              elif suffix in header_suffixes:
                  header_files.append(path)

          # --------------------------------------------------------
          # Convert compile database entry to command
          # --------------------------------------------------------

          def command_from_entry(entry):

              arguments = entry.get("arguments")

              if isinstance(arguments, list):
                  return list(arguments)

              command = entry.get("command")

              if command:
                  return shlex.split(command)

              print(
                  "::error::Compile database entry is missing "
                  "'arguments' and 'command' for "
                  f"{entry.get('file', '<unknown>')}"
              )

              raise SystemExit(1)

          # --------------------------------------------------------
          # Resolve command paths
          # --------------------------------------------------------

          def resolve_path(path_string, base_dir):

              path = Path(path_string)

              if not path.is_absolute():
                  return (base_dir / path).resolve()

              return path.resolve()

          # --------------------------------------------------------
          # Remove compiler output/dependency flags
          # --------------------------------------------------------

          def remove_output_flags(command):

              result = []

              index = 0

              while index < len(command):

                  argument = command[index]

                  if argument in ("-o", "-MF", "-MT"):

                      index += 2
                      continue

                  if (
                      argument.startswith("-MF") or
                      argument.startswith("-MT")
                  ):

                      index += 1
                      continue

                  result.append(argument)

                  index += 1

              return result

          # --------------------------------------------------------
          # Replace source in compiler command
          # --------------------------------------------------------

          def replace_source(
              command,
              original,
              replacement,
              workdir,
          ):

              original = original.resolve()

              for index, argument in enumerate(command):

                  if argument.startswith("-"):
                      continue

                  candidate = Path(argument)

                  if not candidate.is_absolute():

                      candidate = (
                          workdir / candidate
                      ).resolve()

                  else:

                      candidate = candidate.resolve()

                  if candidate == original:

                      command[index] = str(replacement)

                      return

              command.append(str(replacement))

          # --------------------------------------------------------
          # Validate changed sources
          # --------------------------------------------------------

          missing_sources = []

          for source in source_files:

              if source not in entry_by_file:

                  missing_sources.append(
                      str(source.relative_to(repo))
                  )

          if missing_sources:

              print(
                  "::error::No compile database mapping for "
                  "changed source files: "
                  + ", ".join(missing_sources)
              )

              raise SystemExit(1)

          # --------------------------------------------------------
          # Compile changed source files only
          # --------------------------------------------------------

          for source in source_files:

              entry = entry_by_file[source]

              command = command_from_entry(entry)

              workdir = Path(
                  entry["directory"]
              ).resolve()

              source_path = resolve_entry_path(entry)

              replace_source(
                  command,
                  source_path,
                  source_path,
                  workdir,
              )

              print(
                  "Compiling source:",
                  source.relative_to(repo),
              )

              result = subprocess.run(
                  command,
                  cwd=workdir,
              )

              if result.returncode != 0:
                  raise SystemExit(
                      result.returncode
                  )

          # --------------------------------------------------------
          # Validate changed headers
          # --------------------------------------------------------

          def choose_header_command(header_path):

              candidates = []

              for entry in compile_db:

                  source_path = resolve_entry_path(
                      entry
                  )

                  if (
                      source_path.suffix.lower()
                      not in source_suffixes
                  ):
                      continue

                  same_directory = (
                      header_path.parent ==
                      source_path.parent
                  )

                  try:

                      relative_path = (
                          header_path.relative_to(
                              source_path.parent
                          )
                      )

                      distance = len(
                          relative_path.parts
                      )

                  except ValueError:

                      distance = 9999

                  score = (
                      0 if same_directory else 1,
                      distance,
                      str(source_path),
                  )

                  candidates.append(
                      (score, entry)
                  )

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda item: item[0]
              )

              return candidates[0][1]

          for header in header_files:

              entry = choose_header_command(
                  header
              )

              if entry is None:

                  print(
                      "::error::No suitable compile "
                      "command found for changed header: "
                      f"{header.relative_to(repo)}"
                  )

                  raise SystemExit(1)

              command = command_from_entry(
                  entry
              )

              workdir = Path(
                  entry["directory"]
              ).resolve()

              source_path = resolve_entry_path(
                  entry
              )

              with tempfile.NamedTemporaryFile(
                  mode="w",
                  suffix=".cpp",
                  dir=str(header.parent),
                  delete=False,
                  encoding="utf-8",
              ) as temporary_file:

                  temporary_file.write(
                      f'#include "{header.name}"\n'
                  )

                  wrapper = Path(
                      temporary_file.name
                  ).resolve()

              try:

                  header_command = (
                      remove_output_flags(command)
                  )

                  replace_source(
                      header_command,
                      source_path,
                      wrapper,
                      workdir,
                  )

                  if "-fsyntax-only" not in header_command:
                      header_command.append(
                          "-fsyntax-only"
                      )

                  print(
                      "Checking header:",
                      header.relative_to(repo),
                  )

                  result = subprocess.run(
                      header_command,
                      cwd=workdir,
                  )

                  if result.returncode != 0:
                      raise SystemExit(
                          result.returncode
                      )

              finally:

                  try:
                      wrapper.unlink()

                  except FileNotFoundError:
                      pass

          print(
              f"Compiled {len(source_files)} changed "
              "source file(s) and validated "
              f"{len(header_files)} changed header file(s)."
          )

          PY

      # ------------------------------------------------------------
      # Find Python extension targets
      #
      # We do NOT build every CMake target.
      #
      # The target names are inspected first. Targets that look like
      # Python modules are selected for the targeted build.
      # ------------------------------------------------------------

      - name: Find Python extension targets
        id: python_targets
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Available CMake targets:"
          cmake --build build --target help | tee build/cmake_targets.txt

          python - <<'PY'
          import re
          from pathlib import Path

          text = Path(
              "build/cmake_targets.txt"
          ).read_text()

          targets = []

          for line in text.splitlines():

              match = re.search(
                  r'^\.\.\. ([A-Za-z0-9_.+-]+)',
                  line
              )

              if not match:
                  continue

              target = match.group(1)

              lower = target.lower()

              # Common indicators of Python extension targets.
              if any(
                  token in lower
                  for token in (
                      "python",
                      "pybind",
                      "extension",
                      "module",
                  )
              ):
                  targets.append(target)

          # Remove duplicates while preserving order.
          targets = list(dict.fromkeys(targets))

          print("Potential Python extension targets:")

          for target in targets:
              print(f"  {target}")

          if targets:

              Path(
                  "build/python_extension_targets.txt"
              ).write_text(
                  "\n".join(targets) + "\n"
              )

              print(
                  "has_targets=true"
              )

          else:

              print(
                  "::warning::No obvious Python extension "
                  "targets were found."
              )

              Path(
                  "build/python_extension_targets.txt"
              ).write_text("")

          PY

          if [[ -s build/python_extension_targets.txt ]]; then
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # Build ONLY Python extension targets
      #
      # IMPORTANT:
      # This is NOT:
      #
      #   cmake --build build
      #
      # Only explicitly selected extension targets are built.
      #
      # Serial build keeps peak GitHub memory usage low.
      # ------------------------------------------------------------

      - name: Build Python extension targets
        if: >
          steps.cpp_changes.outputs.has_changes == 'true' &&
          steps.python_targets.outputs.has_targets == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r target; do

            [[ -z "$target" ]] && continue

            echo "============================================================"
            echo "Building Python extension target: $target"
            echo "============================================================"

            cmake --build build \
              --target "$target" \
              --config RelWithDebInfo \
              --parallel 1

          done < build/python_extension_targets.txt

      # ------------------------------------------------------------
      # Locate actual Python extension modules
      # ------------------------------------------------------------

      - name: Collect Python extensions
        id: extensions
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          python - <<'PY'
          import sysconfig
          from pathlib import Path
          import shutil

          repo = Path.cwd()
          build = repo / "build"
          dist = repo / "dist"

          extension_suffixes = set(
              sysconfig.get_config_var(
                  "EXT_SUFFIX"
              ) or []
          )

          ext_suffix = sysconfig.get_config_var(
              "EXT_SUFFIX"
          )

          if ext_suffix:
              extension_suffixes.add(
                  ext_suffix
              )

          print(
              "Python extension suffix:",
              ext_suffix
          )

          candidates = []

          for path in build.rglob("*"):

              if not path.is_file():
                  continue

              # Never copy files from CMake metadata
              # directories.
              if "CMakeFiles" in path.parts:
                  continue

              name = path.name

              # Linux CPython extensions normally look like:
              #
              #   module.cpython-39-x86_64-linux-gnu.so
              #
              # Also accept ordinary .so modules.
              if (
                  name.endswith(".so")
                  or ".cpython-" in name and
                  name.endswith(".so")
                  or name.endswith(".pyd")
              ):
                  candidates.append(path)

          # Remove duplicates.
          candidates = list(
              dict.fromkeys(candidates)
          )

          print("Candidate Python extensions:")

          for path in candidates:
              print(
                  "  ",
                  path.relative_to(repo)
              )

          if not candidates:

              print(
                  "::error::No Python extension modules "
                  "were produced."
              )

              raise SystemExit(1)

          for source in candidates:

              destination = dist / source.name

              shutil.copy2(
                  source,
                  destination
              )

          print("Committed extension files:")

          for path in sorted(dist.iterdir()):

              print(
                  "  ",
                  path.name
              )

          PY

          if ! find dist -type f -print -quit | grep -q .; then
            echo "::error::No Python extension files found."
            exit 1
          fi

          echo "has_extensions=true" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Verify extensions are valid Python modules
      #
      # This checks that Python can actually load the generated
      # extension instead of merely checking that a .so exists.
      # ------------------------------------------------------------

      - name: Verify Python extensions
        if: steps.extensions.outputs.has_extensions == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          dist = Path("dist")

          extensions = []

          for path in dist.iterdir():

              if not path.is_file():
                  continue

              if (
                  path.name.endswith(".so") or
                  path.name.endswith(".pyd")
              ):
                  extensions.append(path)

          if not extensions:

              raise SystemExit(
                  "No Python extensions found in dist/"
              )

          print("Testing Python extensions:")

          for extension in extensions:

              name = extension.name.split(
                  ".cpython-",
                  1
              )[0]

              if name.endswith(".so"):
                  name = name[:-3]

              print(
                  f"  {extension.name} -> {name}"
              )

              spec = (
                  importlib.util.spec_from_file_location(
                      name,
                      extension
                  )
              )

              if spec is None:
                  raise SystemExit(
                      f"Unable to create import spec "
                      f"for {extension}"
                  )

              module = (
                  importlib.util.module_from_spec(
                      spec
                  )
              )

              try:

                  spec.loader.exec_module(
                      module
                  )

              except Exception as exc:

                  print(
                      f"::error::Python failed to load "
                      f"{extension.name}: {exc}"
                  )

                  raise

              print(
                  f"Successfully loaded "
                  f"{extension.name}"
              )

          PY

      # ------------------------------------------------------------
      # Show generated files
      # ------------------------------------------------------------

      - name: Show generated Python extensions
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "dist/:"

          if [[ -d dist ]]; then
            find dist -type f -print | sort
          else
            echo "dist/ does not exist."
          fi

      # ------------------------------------------------------------
      # Commit only Python extensions
      # ------------------------------------------------------------

      - name: Commit updated Python extensions
        if: steps.extensions.outputs.has_extensions == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist/

          if git diff --cached --quiet; then
            echo "No binary changes detected."
            exit 0
          fi

          git commit \
            -m "chore: update compiled Python extensions [skip ci]"

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"

      # ------------------------------------------------------------
      # Cache statistics
      # ------------------------------------------------------------

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      # ------------------------------------------------------------
      # Verify expected artifacts
      # ------------------------------------------------------------

      - name: Verify selective build artifacts
        id: verify_artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f build/compile_commands.json ]]; then
            echo "::error::Missing expected artifact:"
            echo "build/compile_commands.json"
            exit 1
          fi

          if [[ "${{ steps.cpp_changes.outputs.has_changes }}" != "true" ]]; then
            echo "No C/C++ source or header changes detected."
            exit 0
          fi

          if [[ ! -f build/changed_cxx_files.txt ]]; then
            echo "::error::Missing changed file list:"
            echo "build/changed_cxx_files.txt"
            exit 1
          fi

          if [[ ! -d dist ]]; then
            echo "::error::Missing Python extension directory:"
            echo "dist/"
            exit 1
          fi

      # ------------------------------------------------------------
      # Upload small artifacts
      # ------------------------------------------------------------

      - name: Upload Python extension artifacts
        if: >
          always() &&
          steps.verify_artifacts.outcome == 'success' &&
          steps.cpp_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asset-asrl-python-extensions-ubuntu-22.04
          path: |
            build/compile_commands.json
            build/changed_cxx_files.txt
            build/changed_cpp_files.txt
            build/python_extension_targets.txt
            dist/
          if-no-files-found: error
          retention-days: 14
