
name: ASSET Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            clang-13 \
            lld-13 \
            ninja-build \
            cmake

      - name: Install ASSET dependencies
        shell: bash
        run: |
          bash install_ubuntu_dependencies.sh

      - name: Configure CMake
        shell: bash
        run: |
          export CC=clang-13
          export CXX=clang++-13

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPIP_INSTALL=True \
            -DBUILD_ASSET_WHEEL=True

      - name: Build ASSET and Python wheel
        shell: bash
        run: |
          cmake --build build \
            --target asset pypiwheel \
            --parallel 2

      - name: List built wheels
        shell: bash
        run: |
          find build -type f -name "*.whl" -print

  windows:
    name: Windows Build (Clang)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"
          directory: ${{ runner.temp }}/llvm
          cached: true

      - name: Install Ninja and MKL
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja mkl-devel intel-openmp

          $pythonPrefix = python -c "import sys; print(sys.prefix)"
          $mklRoot = Join-Path $pythonPrefix "Library"

          "MKLROOT=$mklRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          "ONEAPI_ROOT=$mklRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          "CMAKE_PREFIX_PATH=$mklRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          $mklBin = Join-Path $mklRoot "bin"
          if (Test-Path $mklBin) {
            $mklBin | Out-File `
              -FilePath $env:GITHUB_PATH `
              -Append
          }

      - name: Verify compiler
        shell: pwsh
        run: |
          where.exe clang-cl
          clang-cl --version
          where.exe lld-link
          python --version
          cmake --version

      - name: Configure CMake with clang-cl
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link `
            -DCMAKE_AR=llvm-ar `
            -DCMAKE_RANLIB=llvm-ranlib `
            -DPIP_INSTALL=True `
            -DBUILD_ASSET_WHEEL=True

      - name: Build ASSET and Python wheel
        shell: pwsh
        run: |
          cmake --build build `
            --target asset pypiwheel `
            --parallel 4

      - name: Locate wheel
        id: wheel
        shell: pwsh
        run: |
          $wheels = Get-ChildItem `
            -Path "build/pypiwheel/asset_asrl/dist" `
            -Filter "*.whl" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $wheels) {
            $wheels = Get-ChildItem `
              -Path "build" `
              -Filter "*.whl" `
              -Recurse `
              -File
          }

          if (-not $wheels) {
            throw "No Python wheel was produced."
          }

          $wheel = $wheels |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          "WHEEL_PATH=$($wheel.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Wheel: $($wheel.FullName)"

      - name: Install wheel
        shell: pwsh
        run: |
          python -m pip install --force-reinstall --no-deps "$env:WHEEL_PATH"

      - name: Smoke test imports
        shell: pwsh
        run: |
          python -c "import asset_asrl; print('asset_asrl import succeeded')"
