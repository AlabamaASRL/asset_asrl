      - name: Commit updated C++ binaries
        if: steps.cpp_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t binaries < <(
            find . \
              -type f \
              \( -name "*.so" -o -name "*.so.*" -o -name "*.a" \) \
              -not -path "./.git/*" \
              -not -path "./build/CMakeFiles/*" \
              | sort
          )

          if [[ "${#binaries[@]}" -eq 0 ]]; then
            echo "No compiled binaries found."
            exit 0
          fi

          echo "Compiled binaries:"
          printf '  %s\n' "${binaries[@]}"

          git add -- "${binaries[@]}"

          if git diff --cached --quiet; then
            echo "No binary changes detected."
            exit 0
          fi

          git commit -m "Update C++ binaries [automated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
