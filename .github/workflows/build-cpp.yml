
name: ASSET Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            clang-13 \
            ninja-build \
            cmake

          bash install_ubuntu_dependencies.sh

      - name: Configure
        shell: bash
        run: |
          export CC=clang-13
          export CXX=clang++-13

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPIP_INSTALL=True \
            -DBUILD_SPHINX_DOCS=True

      - name: Build
        shell: bash
        run: |
          cmake --build build \
            --target asset pypiwheel \
            --parallel 2

      - name: List wheels
        shell: bash
        run: |
          find build -type f -name "*.whl" -print

  windows:
    name: Windows Build (Clang + Ninja)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"
          directory: ${{ runner.temp }}/llvm
          cached: true

      - name: Install Ninja and MKL
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja mkl-devel intel-openmp

          $llvm = Join-Path $env:RUNNER_TEMP "llvm/bin"

          if (-not (Test-Path "$llvm/clang-cl.exe")) {
            throw "clang-cl.exe not found at $llvm"
          }

          $pythonPrefix = python -c "import sys; print(sys.prefix)"
          $mklRoot = Join-Path $pythonPrefix "Library"
          $includeDir = Join-Path $mklRoot "include"
          $libDir = Join-Path $mklRoot "lib"
          $binDir = Join-Path $mklRoot "bin"

          $interface = Join-Path $libDir "mkl_intel_lp64_dll.lib"
          $sequential = Join-Path $libDir "mkl_sequential_dll.lib"
          $core = Join-Path $libDir "mkl_core_dll.lib"

          $requiredFiles = @(
            (Join-Path $includeDir "mkl.h"),
            $interface,
            $sequential,
            $core
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required MKL file not found: $file"
            }
          }

          "MKLROOT=$mklRoot" |
            Out-File $env:GITHUB_ENV -Append

          "MKL_INCLUDE_DIRS=$includeDir" |
            Out-File $env:GITHUB_ENV -Append

          "MKL_INTERFACE_LIBRARY=$interface" |
            Out-File $env:GITHUB_ENV -Append

          "MKL_SEQTHR_LIBRARY=$sequential" |
            Out-File $env:GITHUB_ENV -Append

          "MKL_CORE_LIBRARY=$core" |
            Out-File $env:GITHUB_ENV -Append

          "CMAKE_PREFIX_PATH=$mklRoot" |
            Out-File $env:GITHUB_ENV -Append

          if (Test-Path $binDir) {
            $binDir | Out-File $env:GITHUB_PATH -Append
          }

          Write-Host "MKL root: $mklRoot"
          Write-Host "MKL include directory: $includeDir"
          Write-Host "MKL library directory: $libDir"

      - name: Verify toolchain
        shell: pwsh
        run: |
          $llvm = Join-Path $env:RUNNER_TEMP "llvm/bin"

          & "$llvm/clang-cl.exe" --version
          & "$llvm/lld-link.exe" --version
          cmake --version
          ninja --version
          python --version

      - name: Configure CMake
        shell: pwsh
        run: |
          $llvm = Join-Path $env:RUNNER_TEMP "llvm/bin"

          $mklLibraries = @(
            $env:MKL_INTERFACE_LIBRARY
            $env:MKL_SEQTHR_LIBRARY
            $env:MKL_CORE_LIBRARY
          ) -join ";"

          cmake -S . -B build -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DPIP_INSTALL=True" `
            "-DBUILD_SPHINX_DOCS=True" `
            "-DCMAKE_C_COMPILER=$llvm/clang-cl.exe" `
            "-DCMAKE_CXX_COMPILER=$llvm/clang-cl.exe" `
            "-DCMAKE_LINKER=$llvm/lld-link.exe" `
            "-DCMAKE_C_COMPILER_AR=$llvm/llvm-ar.exe" `
            "-DCMAKE_CXX_COMPILER_AR=$llvm/llvm-ar.exe" `
            "-DMKLROOT=$env:MKLROOT" `
            "-DMKL_INCLUDE_DIRS=$env:MKL_INCLUDE_DIRS" `
            "-DMKL_INTERFACE_LIBRARY=$env:MKL_INTERFACE_LIBRARY" `
            "-DMKL_SEQTHR_LIBRARY=$env:MKL_SEQTHR_LIBRARY" `
            "-DMKL_CORE_LIBRARY=$env:MKL_CORE_LIBRARY" `
            "-DMKL_LIBRARIES=$mklLibraries"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE"
          }

      - name: Build ASSET and wheel
        shell: pwsh
        run: |
          cmake --build build `
            --target asset pypiwheel `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE"
          }

      - name: List generated wheels
        shell: pwsh
        run: |
          $wheels = Get-ChildItem `
            -Path build `
            -Filter "*.whl" `
            -Recurse `
            -File

          if (-not $wheels) {
            Write-Warning "No wheel files were found under build."
          } else {
            $wheels | Select-Object -ExpandProperty FullName
          }
