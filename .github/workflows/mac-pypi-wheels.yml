name: build-upload-artifacts-macos

on:
  push:
    branches:
      - mac-test-build
  workflow_dispatch:
  

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install macOS dependencies
        run: |
          brew update
          brew install libomp
          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          which cmake
          cmake --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      - name: Configure CMake
        run: |
          cmake -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            -DPIP_INSTALL=True \
            -DBUILD_ASSET_WHEEL=True \
            -DOpenMP_C_FLAGS="-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include" \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include" \
            -DOpenMP_C_LIB_NAMES="omp" \
            -DOpenMP_CXX_LIB_NAMES="omp" \
            -DOpenMP_omp_LIBRARY="${LIBOMP_PREFIX}/lib/libomp.dylib"

      - name: Build asset module
        run: |
          cmake --build build \
            --target asset \
            --config Release \
            -- -j3

      - name: Build wheel
        run: |
          cmake --build build \
            --target pypiwheel \
            --config Release \
            -- -j3

      - name: Debug - List build directory
        run: |
          echo "=== Shared libraries ==="
          find build -type f \( \
            -name "asset*.so" -o \
            -name "asset*.dylib" \
          \) -print
          echo "=== Wheels ==="
          find build -type f -name "*.whl" -print

      - name: Upload compiled module artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-module-macos-${{ github.run_id }}
          path: |
            build/src/asset*.so
            build/asset*.so
          if-no-files-found: error
          retention-days: 7

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-wheel-macos-${{ github.run_id }}
          path: |
            build/asset_asrl/dist/*.whl
            build/pypiwheel/asset_asrl/dist/*.whl
          if-no-files-found: error
          retention-days: 7
