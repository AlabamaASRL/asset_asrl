name: docs

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 5"

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ubuntu dependencies
        env:
          COMPILER: clang-18
        run: bash $GITHUB_WORKSPACE/.github/install_ubuntu_dependencies.sh

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt -r requirements-docs.txt

      # Documents the released extension module, so the pyd is importable by autodoc.
      - name: Install asset-asrl from PyPI
        run: python -m pip install asset-asrl

      - name: Configure CMake for docs
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DPIP_INSTALL=True -DBUILD_SPHINX_DOCS=True

      - name: Build Sphinx docs
        run: cmake --build build --target sphinx --config Release -- -j1

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-docs
          path: build/doc/sphinx

  deploy-docs:
    needs: build-docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sphinx-docs
          path: build/doc/sphinx

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/doc/sphinx
