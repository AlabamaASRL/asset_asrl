name: Run asset_asrl tests on PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If you have a requirements file, use it:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f asset_asrl/requirements.txt ]; then pip install -r asset_asrl/requirements.txt; fi
          pip install asset-asrl

      - name: Run tests
        run: python asset_asrl/tests/run_tests.py